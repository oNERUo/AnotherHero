/* 얼굴 인식 진행 연출: 화면 전체를 다시 그리지 않고 진행 바·체크 목록만 갱신 → 100%면 특징 확인으로 */
function aiStartScan(){
  clearInterval(S.ai.timer); S.ai.step=1; S.ai.prog=0; render();
  S.ai.timer=setInterval(()=>{
    if(S.screen!=='aiface'||S.ai.step!==1){ clearInterval(S.ai.timer); return; }
    S.ai.prog=Math.min(100,S.ai.prog+4);
    const bar=document.getElementById('aiProg'), pct=document.getElementById('aiPct');
    if(bar) bar.style.width=S.ai.prog+'%'; if(pct) pct.textContent=S.ai.prog+'%';
    document.querySelectorAll('.chk').forEach(el=>{const at=+el.dataset.at, nx=+el.dataset.next;
      el.classList.toggle('done',S.ai.prog>=nx); el.classList.toggle('now',S.ai.prog>=at&&S.ai.prog<nx); el.querySelector('b').textContent=S.ai.prog>=nx?'✓':'';});
    if(S.ai.prog>=100){ clearInterval(S.ai.timer); setTimeout(()=>{ if(S.screen==='aiface'&&S.ai.step===1){ S.ai.step=2; render(); } },350); }
  },110);
}

/* ---- 스토리 도감 (프롤로그 / 1~3장 / 에필로그) ---- */
const CH=[{k:0,n:'프롤로그'},{k:1,n:'1장 들판'},{k:2,n:'2장 설산'},{k:3,n:'3장 폐허'},{k:4,n:'에필로그'}];
function renderStory(){
  const ch=S.sel.ch??S.prog.ch;
  const eps=STORY.filter(e=>e.ch===ch);
  const cur=STORY.find(e=>e.id===S.sel.storyId)||eps.find(e=>S.read.has(e.id))||eps[0];
  const total=STORY.length, got=STORY.filter(e=>S.read.has(e.id)).length;   // 수집 = 읽은 이야기 수
  /* 상태: read(도감 등록) / mail(우편함에 도착했지만 안 읽음) / lock(미도착) */
  const st=e=>S.read.has(e.id)?'read':(isUnlocked(e)?'mail':'lock');
  return `<div class="win">${winHead('story','스토리 도감',`수집 ${got} / ${total}`)}
    <div class="storyb">
      <div class="panel shelf">
        <div class="tabs" role="tablist">${CH.map(c=>{const u=STORY.filter(e=>e.ch===c.k);return `<button class="tab" role="tab" data-ch="${c.k}" aria-selected="${ch===c.k}">${c.n}<span class="n">${u.filter(e=>S.read.has(e.id)).length}/${u.length}</span></button>`}).join('')}</div>
        <div class="scrolls">${eps.map(e=>{const s=st(e);return `<button class="scroll ${s==='read'?'':'locked'} ${s==='mail'?'inmail':''}" data-story="${e.id}" aria-pressed="${cur&&e.id===cur.id}">
          ${s==='mail'?'<span class="chip gold new">우편 도착</span>':''}
          <span class="paper"><small>${e.label}</small><b>${s==='read'?e.title:'???'}</b>${s==='lock'?'<small>잠김</small>':s==='mail'?'<small>읽으면 기록</small>':''}</span></button>`}).join('')}</div>
      </div>
      <div class="panel reader">${cur?(st(cur)==='read'?`
        <header><small>${cur.label} · ${CH.find(c=>c.k===cur.ch).n}</small><h3>${cur.title}</h3></header>
        <div class="body" id="storybody">${cur.text.replace(/</g,'&lt;')}</div>`
        :st(cur)==='mail'?`<div class="lockmsg"><div>우편함에 도착한 이야기입니다<br>우편함에서 읽으면 도감에 기록됩니다<br><br><button class="btn lav" data-act="openMail" data-id="${cur.id}">우편함에서 읽기</button></div></div>`
        :`<div class="lockmsg">아직 도착하지 않은 이야기입니다<br><b>${cur.label}</b> 시 우편함으로 도착</div>`):''}</div>
    </div></div>`;
}

    <div class="ncard"><h3>참고</h3><ul>
      <li>네메시스 소환수 디자인: 까마귀 → 호랑이로 변경</li></ul></div>`,

  party:`<div class="ncard"><h3>파티 설정 · 구성</h3>
      <ul><li>왼쪽 보유 목록(검색) + 오른쪽 4인 슬롯</li>

  };

function render(){
  const g=$('#game'), s=S.screen;
  g.innerHTML = {lobby:renderLobby,stage:renderStage,enhance:renderEnhance,inven:renderInven,mail:renderMail,recruit:renderRecruit,create:renderCreate,aiface:renderAiFace,codex:renderCodex,party:renderParty,story:renderStory}[s]() + globalPopup();
  $('#notes').innerHTML = notesFor(s);
  renderJump(); liveScreen();
  // 모집 결과 카드: 렌더 직후 뒤집기 애니메이션이 보이도록 한 프레임 뒤 open 클래스 적용
  if(s==='recruit'&&S.sel.gResult&&S.sel.gResult.open&&!S.sel.gResult.anim){
    S.sel.gResult.anim=true; document.querySelectorAll('.rcard').forEach(c=>c.classList.remove('open'));
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.rcard').forEach(c=>c.classList.add('open'))));
  }
}
function go(s){ S.screen=s; if(s!=='recruit') S.sel.gResult=null; S.sel.mailOpen=false; S.popup=null; markSeen(s); render(); }

/* 가챠 1회/10회: 등급 없이 풀에서 균등 무작위(확률 미정이라 임시) */
function pull(n){
  const t=S.gTab, list=[];
  for(let i=0;i<n;i++){
    const name=POOL[t][Math.floor(Math.random()*POOL[t].length)];
    let it=S.inv.find(x=>x.cat===t&&x.name===name);
    const dup=!!it;
    if(it) it.count++; else S.inv.push({cat:t,name,count:1});   // 중복은 인벤토리에 수량으로 저장
    list.push({name,dup,count:(it||S.inv.find(x=>x.cat===t&&x.name===name)).count});   // v11: +1 배지에 보유 수 표시
  }
  S.sel.gResult={tab:t,list,open:false};
}

document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-pslot],[data-act],[data-go]'); if(!el) return;
  const d=el.dataset;
  if(d.stop && !e.target.closest('button')) return;      // 팝업 안쪽 클릭은 닫지 않음
  if(d.variant){ S.variant[d.variant]=d.v; render(); return; }
  if(d.act2==='closeResult') S.sel.gResult=null;
  if(d.go){ go(d.go); return; }
  // ----- 인벤토리 -----
  if(d.invtab){ S.sel.invTab=d.invtab; S.sel.invIdx=0; render(); return; }
  if(d.invfx){ S.sel.invFxModel=d.invfx; S.sel.invIdx=0; render(); return; }
  if(d.inv!==undefined){ S.sel.invIdx=+d.inv; render(); return; }
  // ----- 우편함 -----
  if(d.mailtab){ S.sel.mailTab=d.mailtab; S.sel.mailId=null; render(); return; }
  if(d.mail){ S.sel.mailId=d.mail; S.sel.mailOpen=!!d.open; render(); return; }
  // ----- 모집 -----
  if(d.gtab){ S.gTab=d.gtab; render(); return; }
  if(d.gfx){ S.sel.gFxModel=d.gfx; render(); return; }
  // ----- 균열(스테이지) -----
  if(d.stab){ const n=+d.stab; if((S.stageProg[S.stageView.diff][n]||0)===0){ toast(unlockText(S.stageView.diff,n)+'됩니다'); return; } S.stageView.stage=n; render(); return; }
  if(d.diff){ S.stageView.diff=d.diff; if((S.stageProg[d.diff][S.stageView.stage]||0)===0){ const ok=STAGES.filter(s=>S.stageProg[d.diff][s.no]>0).pop(); S.stageView.stage=ok?ok.no:1; } render(); return; }
  if(d.round){ const r=+d.round, v=S.stageView; if(r>(S.stageProg[v.diff][v.stage]||0)){ toast('아직 해금되지 않은 라운드입니다'); return; }
    S.battle={stage:v.stage, round:r, diff:v.diff}; go('lobby'); toast(`${stageOf(v.stage).name} ${v.stage}-${r} · ${v.diff} 전투 시작`); return; }
  // ----- 강화 -----
  if(d.enh){ S.sel.enhId=d.enh; S.enh=null; render(); return; }
  if(d.sk!==undefined){ S.enh.skill=+d.sk; render(); return; }
  if(d.st){ S.enh.add[d.st]=Math.max(0,S.enh.add[d.st]+(+d.d)); render(); return; }   // 미리보기만 변경, '적용' 시 확정

  // ----- 생성 -----
  if(d.g){ S.create.g=d.g; S.create.ai=false; render(); return; }
  if(d.pick){ S.create[d.pick]=d.v; if(d.pick==='model') S.create.fx=defaultFx(d.v); render(); return; }   // 외형이 바뀌면 이펙트 다시 선택
  if(d.fxs!==undefined){ S.create.fx[+d.fxs]=d.v; render(); return; }
  // ----- 도감 -----
  if(d.cattr){ S.sel.codexAttr=d.cattr; S.sel.advId=null; render(); return; }
  if(d.adv){ S.sel.advId=d.adv; S.sel.codexModal=null; render(); return; }
  // ----- 파티 -----
  if(d.rm!==undefined){ S.party[+d.rm]=null; S.sel.pslot=+d.rm; render(); return; }
  if(d.pslot!==undefined){ S.sel.pslot=+d.pslot; render(); return; }
  if(d.roster){
    const i=S.party.indexOf(d.roster);
    if(i>=0){ S.sel.pslot=i; render(); return; }          // 이미 편성 → 그 슬롯 선택
    let slot=S.sel.pslot??S.party.indexOf(null);
    if(slot<0){ toast('슬롯을 먼저 선택하세요'); return; }
    S.party[slot]=d.roster; S.sel.pslot=S.party.indexOf(null); if(S.sel.pslot<0) S.sel.pslot=undefined; render(); return;
  }
  // ----- 스토리 -----
  if(d.ch){ S.sel.ch=+d.ch; S.sel.storyId=null; render(); return; }
  if(d.story){ S.sel.storyId=d.story; render(); return; }   // 도감에서는 선택만 (읽음 처리는 우편함에서)
  // ----- v11: AI 얼굴 인식 부위 토글 · 변경 기록에서 화면 이동 · 접속자 따라가기 -----
  if(d.part){ S.ai.parts[d.part]=!S.ai.parts[d.part]; render(); return; }
  if(d.jumpto){ go(d.jumpto); document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  // ----- 공용 액션 -----
  switch(d.act){
    /* v11 · AI 얼굴 인식 */
    case 'aiCancel': clearInterval(S.ai.timer); S.ai.step=0; render(); break;
    case 'aiRetake': S.create.photo=null; S.ai.step=0; render(); break;
    case 'aiApply': S.ai.step=3; render(); break;
    case 'aiBack': S.ai.step=2; render(); break;
    case 'aiDone': S.create.ai=true; S.ai.step=0; go('create'); toast(`AI 얼굴 적용 완료 · 반영 부위 ${aiPartsOn()}/7`); break;
    /* v11 · 공용 팝업 */
    case 'lackSkill': { const a=S.adv.find(x=>x.id===S.enh.id), c=skillCost(a.skill[S.enh.skill]); S.popup={kind:'lack',need:{gold:c.gold,stone:c.stone},sub:'스킬 강화에 필요한 재화가 모자라요'}; render(); break; }
    case 'popClose': S.popup=null; render(); break;
    case 'popGo': S.popup=null; go(d.to); break;
    case 'createdOk': S.popup=null; go('codex'); break;
    case 'createdParty': { const id=S.popup.id; S.popup=null; const i=S.party.indexOf(null); S.sel.pslot=i>=0?i:0; go('party'); toast(i>=0?`${i+1}번 슬롯을 골라 두었어요 · 모험가를 누르면 편성`:'빈 슬롯이 없어요 · 바꿀 슬롯을 고르세요'); break; }
    /* 오프라인 보상: 팝업 확인 시 이미 자동 수령된 재화를 반영하고 우편함에 알림 기록 추가 */
    case 'offlineOk': { Object.entries(S.offline.items).forEach(([k,c])=>S.cur[k]+=c); S.offline.shown=true; addOfflineNotice(); render(); toast('우편함에 수령 알림이 기록되었습니다'); break; }
    case 'replayOffline': { S.offline.shown=false; go('lobby'); break; }
    case 'checkNotice': { const m=S.mails.find(x=>x.id===d.id); m.done=true; render(); break; }
    case 'checkAll': { let n=0; S.mails.forEach(m=>{ if(!m.done){ m.done=true; if(m.type==='story'){ S.read.add(m.story); n++; } } });
      toast(n?`모두 확인 · 스토리 ${n}편이 도감에 기록되었습니다`:'알림을 모두 확인했습니다'); render(); break; }
    case 'takeStory': { S.read.add(d.id); const m=S.mails.find(x=>x.story===d.id); if(m) m.done=true; toast('스토리 도감에 기록되었습니다'); render(); break; }
    /* 강화 */
    case 'skillUp': { const a=S.adv.find(x=>x.id===S.enh.id), c=skillCost(a.skill[S.enh.skill]); S.cur.gold-=c.gold; S.cur.stone-=c.stone; a.skill[S.enh.skill]++; toast(`${SKILLS[a.model][S.enh.skill].n} 강화 완료 · Lv.${a.skill[S.enh.skill]}`); render(); break; }
    case 'statReset': { Object.keys(S.enh.add).forEach(k=>S.enh.add[k]=0); render(); break; }      // 적용 전 미리보기만 되돌림
    case 'statApply': { const a=S.adv.find(x=>x.id===S.enh.id); let used=0;
      const gold=Object.entries(S.enh.add).reduce((s,[k,n])=>{let g=0;for(let i=1;i<=n;i++) g+=statGold((a.slv[k]||0)+i);return s+g},0);
      Object.entries(S.enh.add).forEach(([k,n])=>{a.slv[k]=(a.slv[k]||0)+n; used+=n; S.enh.add[k]=0});
      S.cur.gold-=gold; toast(`스탯 ${used}포인트 적용 · 금화 ${fmt(gold)} 사용`); render(); break; }
    /* 스탯 초기화: 화면 안 확인창 → 적용된 포인트 전부 반환 */
    case 'statResetAll': S.enh.confirm=true; render(); break;
    case 'statResetCancel': S.enh.confirm=false; render(); break;
    case 'statResetOk': { const a=S.adv.find(x=>x.id===S.enh.id); const back=Object.values(a.slv).reduce((s,n)=>s+n,0);
      Object.keys(a.slv).forEach(k=>a.slv[k]=0);   // 포인트만 반환, 금화는 환급 없음 Object.keys(S.enh.add).forEach(k=>S.enh.add[k]=0); S.enh.confirm=false;
      toast(`스탯 포인트 ${back}개를 돌려받았습니다 (금화 환급 없음)`); render(); break; }
    case 'openMail': { S.sel.mailTab='all'; S.sel.mailId='m-'+d.id; go('mail'); break; }
    case 'readStory': { S.read.add(d.id); const m=S.mails.find(x=>x.story===d.id); if(m) m.done=true; S.sel.storyId=d.id; S.sel.ch=STORY.find(x=>x.id===d.id).ch; go('story'); toast('스토리 도감에 기록됨'); break; }
    case 'closeOverlay': if(e.target===el || el.tagName==='BUTTON'){ S.sel.mailOpen=false; render(); } break;
    case 'pull': pull(+d.n); render(); break;
    case 'reveal': S.sel.gResult.open=true; render(); break;
    case 'closeResult': S.sel.gResult=null; render(); break;
    case 'samplePhoto': e.preventDefault(); S.create.photo=A.heroFace; S.create.ai=false; if(S.screen==='aiface') aiStartScan(); else render(); break;
    case 'saveAdv': {
      const c=S.create, id='a'+(S.adv.length+1);
      if(S.adv.length>=ADV_MAX){ toast('모험가는 최대 50명까지 보유할 수 있어요'); break; }
      // 생성에 사용한 요소 1개씩 소모 (0개가 되면 인벤토리에서 제거)
      [['model',c.model],['attr',c.attr],['pers',c.pers],...c.fx.map(n=>['fx',n])].forEach(([cat,n])=>{const it=S.inv.find(i=>i.cat===cat&&i.name===n); if(it){it.count--; if(it.count<=0) S.inv.splice(S.inv.indexOf(it),1);}});
      S.adv.push({id,name:c.name.trim(),g:c.g,model:c.model,attr:c.attr,pers:c.pers,fx:[...c.fx],face:c.ai,photo:c.photo,power:2400,lv:1,slv:{hp:0,atk:0,def:0,crit:0,aspd:0,cdr:0},skill:[0,0,0]});
      S.create=null; S.ai.parts=null; S.sel.advId=id; S.sel.codexAttr='all'; S.popup={kind:'created',id}; render(); toast('모험가 도감에 등록되었습니다 · 사용한 요소 소모'); break; }
    /* 도감: 이름 변경 / 삭제 */
    case 'renameOpen': S.sel.codexModal='rename'; render(); break;
    case 'lackRename': S.sel.codexModal=null; S.popup={kind:'lack',need:{gold:RENAME_GOLD},sub:'이름 변경에 필요한 금화가 모자라요'}; render(); break;
    case 'deleteOpen': S.sel.codexModal='delete'; render(); break;
    case 'modalClose': S.sel.codexModal=null; render(); break;
    case 'renameOk': { const a=S.adv.find(x=>x.id===S.sel.advId)||S.adv[0]; const v=$('#renameinput').value.trim();
      if(!v){ toast('이름을 입력해 주세요'); break; } if(S.cur.gold<RENAME_GOLD){ toast('금화가 부족합니다'); break; } S.cur.gold-=RENAME_GOLD; a.name=v.slice(0,NAME_MAX); S.sel.codexModal=null; toast(`이름을 변경했습니다 · 금화 ${fmt(RENAME_GOLD)} 사용`); render(); break; }
    case 'deleteOk': { const a=S.adv.find(x=>x.id===S.sel.advId)||S.adv[0]; S.adv.splice(S.adv.indexOf(a),1);
      S.party=S.party.map(id=>id===a.id?null:id); S.sel.advId=null; S.sel.codexModal=null; toast(`${a.name}을(를) 삭제했습니다`); render(); break; }
    case 'clearParty': S.party=[null,null,null,null]; S.sel.pslot=0; render(); break;
    case 'saveParty': toast('파티 편성을 저장했습니다'); break;
  }
});

});
/* 키보드: 파티 슬롯(div) Enter 선택 */
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.pslot!==undefined&&e.target.tagName!=='BUTTON'){ e.target.click(); } });

/* 1920×1080 프레임을 컨테이너 폭에 맞춰 축소 */
function fit(){ const w=$('#stage').clientWidth; $('#game').style.transform=`scale(${w/1920})`; }
new ResizeObserver(fit).observe(document.getElementById('stage'));


/* =====================================================================
   v11 · 1초 길게 누르기 (삭제·스탯 초기화). 마우스·터치·키보드(Space/Enter) 모두 지원
   ===================================================================== */
let holdT=null;
function holdStart(btn){ holdEnd(); btn.classList.add('holding');
  holdT=setTimeout(()=>{ holdEnd(); const b=document.createElement('button'); b.hidden=true; b.dataset.act=btn.dataset.hold; $('#game').appendChild(b); b.click(); b.remove(); },1000); }
function holdEnd(){ clearTimeout(holdT); holdT=null; document.querySelectorAll('.hold.holding').forEach(b=>b.classList.remove('holding')); }
document.addEventListener('pointerdown',e=>{ const b=e.target.closest('[data-hold]'); if(b) holdStart(b); });
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,e=>{ if(holdT&&(t!=='pointerleave'||e.target.closest?.('[data-hold]'))) holdEnd(); },true));
document.addEventListener('keydown',e=>{ const b=e.target.closest&&e.target.closest('[data-hold]'); if(b&&(e.key===' '||e.key==='Enter')&&!e.repeat){ e.preventDefault(); holdStart(b); } });
document.addEventListener('keyup',e=>{ if(e.target.closest&&e.target.closest('[data-hold]')&&(e.key===' '||e.key==='Enter')) holdEnd(); });

/* =====================================================================
   v11 · 변경 기록 + NEW 표시 (이 브라우저에서 아직 안 연 화면만 NEW)
   ===================================================================== */
const SEEN_KEY='ah_seen_'+VER;
let seen=new Set(); try{ seen=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]')); }catch(e){}
function markSeen(s){ if(seen.has(s)) return; seen.add(s); try{ localStorage.setItem(SEEN_KEY,JSON.stringify([...seen])); }catch(e){} }
const changedNow=new Set(CHANGELOG[0].items.flatMap(i=>i.s));
function renderChangelog(){
  const el=$('#changelog');
  el.innerHTML=`<h3>변경 기록</h3>`+CHANGELOG.map(v=>`<div class="ver"><div class="vh"><b>${v.v}</b><span>${v.date}${v.v===VER?' · 지금 보는 버전':''}</span></div>
    <ol>${v.items.map(i=>`<li>${i.t}${i.s.map(s=>`<button class="scr" data-jumpto="${s}">${SCREENS[s]} 보기</button>`).join('')}</li>`).join('')}</ol></div>`).join('');
}
function toggleLog(){ const el=$('#changelog'); el.hidden=!el.hidden; if(!el.hidden) renderChangelog(); renderLive(); }

/* =====================================================================
   v11 · 실시간 접속 (room: 지금 이 링크를 연 사람 · 보는 화면 · 커서 / user: 이름)
   - 연결이 안 되는 보기(로그인 안 함·공개 링크)에서도 페이지는 그대로 동작
   ===================================================================== */
const LIVE={room:null,user:null,peers:[],names:{},on:false};
const PCOL=['#e3557a','#6c62c4','#2f8f64','#d08a12','#2b74b0','#9b4fc4','#c4513a','#3a8f8f'];
const colOf=p=>PCOL[[...p].reduce((h,c)=>h*31+c.charCodeAt(0)>>>0,7)%PCOL.length];
const viewers=()=>LIVE.peers.filter(p=>p.kind==='viewer');
function renderJump(){
  const s=S.screen;
  $('#jump').innerHTML=Object.entries(SCREENS).map(([k,l])=>{
    const dots=viewers().filter(p=>!p.isMe&&p.presence.screen===k).map(p=>`<i style="background:${colOf(p.peer)}"></i>`).join('');
    return `<button data-go="${k}" aria-current="${k===s}">${l}${dots?`<span class="pdots" aria-label="보는 사람 있음">${dots}</span>`:''}${changedNow.has(k)&&!seen.has(k)?'<span class="newdot">NEW</span>':''}</button>`}).join('');
}
async function renderLive(){
  const el=$('#livebar'); if(!el) return;
  const vs=viewers();
  const ids=[...new Set(vs.map(p=>p.by||p.presence.uid).filter(Boolean))];
  let ps={}; try{ if(LIVE.user&&ids.length) ps=await LIVE.user.profiles(ids); }catch(e){}
  const nm=p=>{const id=p.by||p.presence.uid; return (id&&ps[id]&&ps[id].name)||'팀원';};
  vs.forEach(p=>{ LIVE.names[p.peer]=nm(p); });
  const open=!$('#changelog').hidden;
  const chips=vs.map(p=>{const n=nm(p), scr=SCREENS[p.presence.screen]||'';
    const inner=`<i style="background:${colOf(p.peer)}">${(n[0]||'?')}</i>${p.isMe?(p.sameTab?'나':'나(다른 탭)'):n}<small>· ${scr}</small>`;
    return p.isMe?`<span class="peer">${inner}</span>`:`<button class="peer" data-go="${p.presence.screen||'lobby'}" title="${n}이(가) 보는 화면으로 이동">${inner}</button>`}).join('');
  el.innerHTML=`<span class="dot ${LIVE.on?'':'off'}"></span><span>${LIVE.on?`실시간 · 지금 ${vs.length||1}명 보는 중`:(window.claude?'실시간 연결 없음 · 새 버전은 링크를 다시 열면 반영':'웹사이트 보기 · 새 버전이 올라오면 위에 안내가 떠요')}</span>${chips}
    <button class="logbtn" id="logbtn" aria-expanded="${open}">변경 기록<b>${VER}</b></button>`;
  renderJump(); drawCursors();
}
/* 다른 사람 커서: 같은 화면을 보는 사람만, 1920×1080 기준 비율 좌표 */
function drawCursors(){
  const box=$('#cursors'); if(!box) return; const w=$('#stage').clientWidth, h=$('#stage').clientHeight;
  box.innerHTML=viewers().filter(p=>!p.isMe&&p.presence.screen===S.screen&&typeof p.presence.cx==='number').map(p=>{const c=colOf(p.peer);
    return `<div class="cur-r" style="left:${p.presence.cx*w}px;top:${p.presence.cy*h}px"><svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M1 1 L1 18 L6 13 L10 21 L13 19.5 L9 12 L16 12 Z" fill="${c}" stroke="#fff" stroke-width="1.5"/></svg><span style="background:${c}">${LIVE.names[p.peer]||''}</span></div>`}).join('');
}
function liveScreen(){ if(LIVE.room) LIVE.room.presence({screen:S.screen}).catch(()=>{}); }
async function liveInit(){
  try{ LIVE.user=await window.claude?.use?.('user'); }catch(e){}
  try{ LIVE.room=await window.claude?.use?.('room'); }catch(e){}
  if(!LIVE.room){ renderLive(); return; }
  LIVE.on=true;
  let uid=null; try{ uid=LIVE.user?await LIVE.user.id():null; }catch(e){}
  LIVE.room.presence({screen:S.screen, uid}).catch(()=>{});
  LIVE.room.onPeers(ch=>{ LIVE.peers=ch.peers; renderLive(); }, ()=>{ LIVE.on=false; LIVE.room=null; LIVE.peers=[]; renderLive(); });
  // 커서: 게임 프레임 위에서만 비율 좌표 공유 (프레임 밖으로 나가면 지움)
  const st=$('#stage'); let last=0;
  st.addEventListener('pointermove',e=>{ const now=performance.now(); if(now-last<40) return; last=now;
    const r=st.getBoundingClientRect(); LIVE.room&&LIVE.room.presence({cx:+((e.clientX-r.left)/r.width).toFixed(4),cy:+((e.clientY-r.top)/r.height).toFixed(4)}).catch(()=>{}); });
  st.addEventListener('pointerleave',()=>{ LIVE.room&&LIVE.room.presence({cx:null,cy:null}).catch(()=>{}); });
  new ResizeObserver(drawCursors).observe(st);
}
document.addEventListener('click',e=>{ if(e.target.closest('#logbtn')) toggleLog(); });

/* =====================================================================
   부팅: 새 버전이 올라오면 열려 있는 화면이 자동으로 바뀜 → 보던 화면을 그대로 이어서 보여 주고 '업데이트됨' 안내
   ===================================================================== */
try{ window.claude?.hot?.snapshot?.(()=>({screen:S.screen, ver:VER, offline:S.offline.shown})); }catch(e){}
function start(data){
  data=data||{};
  seedInventory(); seedAdventurers(); seedMail();
  if(data.offline) { S.offline.shown=true; }
  if(data.screen && SCREENS[data.screen]) S.screen=data.screen;
  markSeen(S.screen);
  if(data.ver && data.ver!==VER){
    const u=$('#updated'); u.className='updated'; u.hidden=false;
    u.innerHTML=`새 버전 <b>${VER}</b>으로 바뀌었어요 · 보던 화면은 그대로 · <button class="logbtn" data-showlog="1" style="margin-left:6px">무엇이 바뀌었나 보기</button>`;
    setTimeout(()=>{u.hidden=true;},12000);
  }
  render(); fit(); renderLive(); liveInit();
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-showlog]')){ $('#updated').hidden=true; if($('#changelog').hidden) toggleLog(); } });
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>


<script>
/* 웹사이트 전용: 1분마다 version.json을 확인해 새 버전이 올라오면 상단에 '새로고침' 안내 (Claude 링크에서는 자동 갱신이라 불필요) */
(function(){
  if(window.claude) return;                                 // Claude 아티팩트로 열린 경우는 자동 갱신 사용
  const lb=document.getElementById('livebar');
  function note(){ if(lb && !lb.dataset.web){ lb.dataset.web='1'; } }
  async function check(){
    try{
      const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
      const v=(await r.json()).ver;
      if(v && v!==VER){
        const u=document.getElementById('updated'); u.className='updated'; u.hidden=false;
        u.innerHTML='새 버전 <b>'+v+'</b>이 올라왔어요 · <button class="logbtn" onclick="location.reload()" style="margin-left:6px">새로고침해서 보기</button>';
      }
    }catch(e){}
  }
  note(); setInterval(check,60000); setTimeout(check,3000);
})();
</script></body></html>
