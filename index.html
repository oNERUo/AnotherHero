<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Another Hero 팀 공유 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* =====================================================================
   Another Hero · UI 초기시안 프로토타입
   레이아웃 개념: 1920×1080 게임 프레임(PC 기준)을 화면 폭에 맞춰 축소 표시하고,
   프레임 아래에 '설계 노트(시안 비교·결정 필요 항목)' 패널을 붙인다.
   색 토큰: 기존 로비·스테이지·오프라인 보상 시안의 라벤더/핑크/골드 계열을 그대로 이어받음.
   ※ 게임 화면 자체는 '파스텔 라이트' 단일 룩으로 고정(게임 아트가 라이트 기준이므로).
   ===================================================================== */
:root{
  /* 게임 UI 팔레트 (아트기획서: High-Key Pastel Candy) */
  --ink:#3b3363;          /* 본문 글자: 선화 네이비-퍼플 계열 */
  --ink-soft:#7a7299;     /* 보조 글자 */
  --lav:#8f86d9;          /* 메뉴 라벨 pill 색(기존 아이콘 라벨과 동일) */
  --lav-deep:#6c62c4;
  --lav-soft:#eeebfd;
  --pink:#ff7f9e;         /* 오프라인 보상 '확인' 버튼 색 */
  --pink-soft:#ffe8ef;
  --gold:#e3ad45;         /* 프레임 장식 골드 */
  --gold-soft:#fff3d6;
  --paper:#fffdf9;        /* 카드 바탕 */
  --line:#e6def8;         /* 카드 테두리 */
  --mint:#5fc59a;
  /* 속성 컬러 (아트기획서 속성 컬러 표 기준) */
  --fire:#ff8a6b; --water:#4fb0ec; --ice:#93c9f0; --grass:#5fc58a; --light:#f2c03c; --dark:#7b68c8;
  /* 프레임 바깥(설계 노트 영역) 토큰 */
  --page:#f4f2fb; --page-fg:#2c2748; --page-mute:#6d6890; --page-card:#ffffff; --page-line:#dcd6f0;
  /* 글꼴: 제목=Jua(둥근 귀여운 장식체), 본문=Noto Sans KR */
  --f-title:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#1b1830; --page-fg:#ece9fb; --page-mute:#a59fc8; --page-card:#252140; --page-line:#3a3560; color-scheme:dark }
}
:root[data-theme="dark"]{ --page:#1b1830; --page-fg:#ece9fb; --page-mute:#a59fc8; --page-card:#252140; --page-line:#3a3560; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--page);color:var(--page-fg);font-family:var(--f-body);margin:0}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lav-deep);outline-offset:2px}
/* ===================== v11 추가 ===================== */
/* 속성 아이콘(인라인 SVG): 줄 안에서 글자와 나란히 */
.attrico{display:inline-block;vertical-align:middle;flex-shrink:0}
/* 스킬 칸: 금테 + 속성 없는 라벤더 바탕 (스킬 아이콘 틀 시안) */
.skico{background:linear-gradient(135deg,#b7aef0,#e8a6d8);border:5px solid #f1cf86;box-shadow:0 4px 0 #d4a55a}
.skill{border:4px solid #f1cf86;box-shadow:0 4px 0 #d4a55a;background:linear-gradient(#fffaf0,#f3efff)}
/* 가챠 결과 카드: 금테 카드 + 뒷면 그림 + NEW / +1 배지 */
.rcard{height:300px}
.rcard .back{background:none;border:0;padding:0}
.rcard .back svg{width:100%;height:100%}
.rcard .front{border:6px solid #f1cf86;box-shadow:0 5px 0 #d4a55a;overflow:visible}
.rcard .front .tint{position:absolute;left:0;right:0;top:0;height:52%;border-radius:20px 20px 0 0;opacity:.45}
.rcard .front > *{position:relative}
.rbadge{position:absolute!important;top:-16px;right:-10px;border:3px solid #fff;border-radius:999px;padding:2px 14px;font-weight:900;font-size:18px;color:#fff}
.rbadge.new{background:var(--pink)} .rbadge.dup{background:var(--mint)}
.ribbon{isolation:isolate;display:inline-flex;align-items:center;gap:16px;position:relative;margin:0 auto;padding:10px 60px;border-radius:16px;background:linear-gradient(#ffa3bb,#ff7f9e);border:3px solid #fff2c8;color:#fff;font-family:var(--f-title);font-size:40px;text-shadow:0 2px 0 #e3607f}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:14px;width:46px;height:52px;background:#e3607f;z-index:-1}
.ribbon::before{left:-36px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon::after{right:-36px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
/* 공용 팝업(오프라인 보상 팝업 구조 재사용) */
.offpop.sm{width:920px}
.offpop .offcard.center{text-align:center;align-items:center}
.need{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:16px;padding:14px 20px;border-radius:20px;background:#fff4e8;font-size:22px}
.need.short{background:var(--pink-soft)}
.need img{width:56px;height:56px} .need b{font-size:24px}
.need .have{font-weight:900;color:#2f8f64;font-variant-numeric:tabular-nums} .need.short .have{color:#e3557a}
.hold{position:relative;overflow:hidden}
.hold .holdbar{position:absolute;left:0;bottom:0;height:7px;width:0;background:rgba(255,255,255,.9)}
.hold.holding .holdbar{width:100%;transition:width 1s linear}
/* AI 얼굴 인식 화면 */
.aisteps{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:-6px 0 4px}
.aistep{display:flex;flex-direction:column;align-items:center;gap:6px;width:200px;position:relative;font-size:18px;font-weight:700;color:#a8a3c2}
.aistep i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:20px;background:#fff;border:3px solid var(--line);color:#a8a3c2;position:relative;z-index:1}
.aistep::before{content:"";position:absolute;top:21px;right:50%;width:100%;height:5px;background:var(--line);border-radius:3px}
.aistep:first-child::before{display:none}
.aistep.done{color:var(--ink)} .aistep.done i{background:var(--gold);border-color:#fff;color:#fff} .aistep.done::before,.aistep.now::before{background:var(--gold)}
.aistep.now{color:var(--ink)} .aistep.now i{background:var(--pink);border-color:#fff;color:#fff;width:50px;height:50px;margin-top:-2px}
.aif{display:grid;grid-template-columns:1080px 1fr;gap:28px;flex:1;min-height:0}
.aif .panel{padding:30px 36px;display:flex;flex-direction:column;gap:20px;min-height:0}
.drop{flex:1;border:4px dashed var(--lav);border-radius:30px;background:var(--lav-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.drop .cam{width:150px;height:150px;border-radius:50%;background:#fff;border:4px solid var(--lav);display:grid;place-items:center}
.drop b{font-size:34px} .drop span{font-size:20px;color:var(--ink-soft)}
.safe{display:flex;gap:18px;align-items:center;padding:20px 24px;border-radius:24px;background:#fff4e8;font-size:19px;color:var(--ink-soft)}
.safe b{display:block;font-size:23px;color:var(--ink)}
.shield{width:46px;height:52px;flex-shrink:0;background:var(--mint);clip-path:polygon(50% 0,100% 18%,100% 55%,50% 100%,0 55%,0 18%);display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tip{border-radius:24px;padding:18px;background:var(--lav-soft);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:20px;font-weight:700;position:relative}
.tip.bad{background:#f3f1f8;color:var(--ink-soft)}
.tip .mk{position:absolute;right:14px;top:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
.tip .mk.ok{background:var(--mint)} .tip .mk.no{background:var(--pink)}
.tip .face{width:110px;height:110px;border-radius:50%;background:#fff;position:relative;overflow:hidden}
.tip .face::before{content:"";position:absolute;left:31px;top:20px;width:48px;height:48px;border-radius:50%;background:var(--line)}
.tip .face::after{content:"";position:absolute;left:15px;top:72px;width:80px;height:60px;border-radius:40px 40px 0 0;background:var(--line)}
.tip .face.cover b{position:absolute;left:24px;top:34px;width:62px;height:20px;border-radius:8px;background:var(--ink-soft);z-index:2}
.tip .face.many::before{left:6px;width:40px;height:40px;top:26px} .tip .face.many i{position:absolute;right:6px;top:26px;width:40px;height:40px;border-radius:50%;background:var(--line)}
.parts{display:flex;gap:10px;flex-wrap:wrap}
.parts svg{width:52px;height:52px}
.photo{position:relative;flex:1;border-radius:30px;background:#e9e5f5;overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .sil{width:300px;height:300px;border-radius:50%;background:#d8d2ec;margin-top:-80px}
.scanbox{position:absolute;left:50%;top:44%;width:360px;height:400px;transform:translate(-50%,-50%)}
.scanbox i{position:absolute;width:56px;height:56px;border:7px solid var(--pink)}
.scanbox i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.scanbox i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.scanbox i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
.scanbox i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
.scanbox .line{position:absolute;left:12px;right:12px;height:6px;border-radius:3px;background:var(--pink);opacity:.8;top:10%;animation:scan 1.6s ease-in-out infinite alternate}
.scanbox.done i{border-color:var(--mint)} .scanbox.done .line{display:none}
@keyframes scan{to{top:88%}}
@media (prefers-reduced-motion: reduce){.scanbox .line{animation:none;top:50%}}
.okpill{position:absolute;left:50%;top:-26px;transform:translateX(-50%);white-space:nowrap;background:var(--mint);color:#fff;border-radius:999px;padding:6px 20px;font-size:20px;font-weight:900}
.prog{height:40px;border-radius:20px;background:var(--pink-soft);border:3px solid #fff;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pink);border-radius:20px}
.chk{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:22px;background:#f6f4fb;font-size:23px;font-weight:700;color:#a8a3c2}
.chk.done{background:#fff4e8;color:var(--ink)} .chk.now{background:var(--pink-soft);color:var(--ink);font-weight:900}
.chk b{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);background:#fff;display:grid;place-items:center;color:#fff;font-size:20px}
.chk.done b{background:var(--gold);border-color:var(--gold)} .chk.now b{border-color:var(--pink);border-top-color:var(--pink-soft);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.chk.now b{animation:none}}
.prow{display:grid;grid-template-columns:64px 110px 1fr 80px;align-items:center;gap:16px;padding:9px 18px;border-radius:22px;background:#fff4e8;font-size:23px;font-weight:900}
.prow.off{background:#f6f4fb;color:#a8a3c2}
.prow .val{justify-self:start;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-size:19px;font-weight:700;color:var(--lav-deep)}
.prow.off .val{color:#a8a3c2}
.tg{width:76px;height:40px;border-radius:20px;border:0;background:#d7d3e6;position:relative;padding:0}
.tg::after{content:"";position:absolute;left:5px;top:5px;width:30px;height:30px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-pressed="true"]{background:var(--pink)} .tg[aria-pressed="true"]::after{left:41px}
.ba{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:0;flex:1;min-height:0}
.ba figure{margin:0;height:100%;border-radius:30px;border:4px solid var(--line);background:#f3f1f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;position:relative}
.ba figure.after{border-color:var(--pink);background:var(--lav-soft)}
.ba figure img{height:620px}
.ba figcaption{position:absolute;bottom:20px;background:#fff;border-radius:999px;padding:6px 26px;font-size:20px;font-weight:900;color:var(--ink-soft)}
.ba figure.after figcaption{background:var(--pink);color:#fff}
.ba .arr{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid #f1d39b;display:grid;place-items:center;font-size:32px;color:var(--pink);font-weight:900;margin:auto;z-index:1}
.sum{display:grid;grid-template-columns:110px 1fr;gap:14px 14px;align-items:center;font-size:21px}
.sum span{color:var(--ink-soft)}
/* 모험가 생성 2단계: AI 얼굴 카드 */
.aicard{display:flex;gap:16px;align-items:center}
.aicard .box{width:120px;height:150px;border-radius:18px;background:var(--lav-soft);overflow:hidden;border:3px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--ink-soft)}
.aicard .box img{width:100%;height:100%;object-fit:cover;object-position:top}

/* ---------- 실시간 공유 (프레임 바깥) ---------- */
.livebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.86rem;color:var(--page-mute)}
.livebar .dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.2)}
.livebar .dot.off{background:var(--page-line);box-shadow:none}
.peer{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--page-line);background:var(--page-card);color:var(--page-fg);border-radius:999px;padding:3px 10px 3px 3px;font-size:.82rem}
.peer i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:.72rem}
.peer small{color:var(--page-mute)}
button.peer{cursor:pointer}
.logbtn{border:1px solid var(--page-line);background:var(--page-card);color:var(--page-fg);border-radius:999px;padding:5px 12px;font-size:.85rem}
.logbtn b{background:var(--lav-deep);color:#fff;border-radius:999px;padding:0 7px;margin-left:4px;font-size:.75rem}
.jump button{position:relative}
.jump .newdot{position:absolute;top:-5px;right:-4px;background:#e3557a;color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:1.5}
.jump .pdots{display:inline-flex;gap:2px;margin-left:5px;vertical-align:middle}
.jump .pdots i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid #fff}
.changelog{background:var(--page-card);border:1px solid var(--page-line);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.changelog h3{margin:0;font-size:1.02rem}
.changelog ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px;font-size:.92rem;line-height:1.6}
.changelog .ver{display:flex;flex-direction:column;gap:6px}
.changelog .ver + .ver{border-top:1px solid var(--page-line);padding-top:10px}
.changelog .vh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.changelog .vh b{font-size:.95rem} .changelog .vh span{color:var(--page-mute);font-size:.82rem}
.changelog .scr{display:inline-block;font-size:.72rem;border:1px solid var(--page-line);border-radius:6px;padding:0 6px;margin-left:4px;color:var(--page-mute);cursor:pointer;background:transparent}
.updated{background:var(--lav-deep);color:#fff;border-radius:12px;padding:10px 16px;font-size:.92rem}
.cursors{position:absolute;inset:0;pointer-events:none;z-index:30}
.cursors .cur-r{position:absolute;transform:translate(-2px,-2px);transition:left .08s linear,top .08s linear}
.cursors .cur-r span{position:absolute;left:16px;top:14px;white-space:nowrap;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}


/* ---------- 상단: 제목 + 화면 바로가기 ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-family:var(--f-title);font-weight:400;font-size:1.7rem;margin:0;letter-spacing:.01em}
.top p{margin:4px 0 0;color:var(--page-mute);font-size:.9rem}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--page-line);background:var(--page-card);color:var(--page-fg);border-radius:999px;padding:6px 12px;font-size:.85rem}
.jump button[aria-current="true"]{background:var(--lav-deep);border-color:var(--lav-deep);color:#fff}

/* ---------- 게임 프레임(1920×1080을 비율 축소) ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(60,40,120,.18);background:#ddd6f5}
#game{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:var(--ink);font-family:var(--f-body);overflow:hidden;background:#efeafc}

/* 로비 배경: 기존 스테이지 배경을 흐리게 깔아 로비 분위기만 표현 */
.bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.05);opacity:.85}
.bg-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(238,232,255,.55))}

/* 재화 바 (로비 상단) */
.curbar{position:absolute;left:36px;top:30px;display:flex;gap:22px;z-index:3}
.cur{position:relative;display:flex;align-items:center;height:62px;padding:0 26px 0 74px;border-radius:999px;min-width:300px;color:#fff;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;border:3px solid #fff4dc;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.cur img{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:84px;height:84px}
.cur.gold{background:linear-gradient(#d7a548,#b8862f)}
.cur.stone{background:linear-gradient(#8b7ff0,#5f55c9)}
.cur.shard{background:linear-gradient(#e78bd3,#b363c4)}

/* 로비 메뉴 아이콘 (기존 아이콘 이미지 사용, 라벨 포함 이미지) */
.menu{position:absolute;display:flex;flex-direction:column;gap:10px;z-index:3}
.menu.left{left:40px;top:150px}
.menu.right{right:40px;top:120px}
.mbtn{position:relative;width:168px;height:168px;border:0;background:none;padding:0;transition:transform .15s}
.mbtn img{width:100%;height:100%}
.mbtn:hover{transform:translateY(-4px) scale(1.03)}
.mbtn.off{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.mbtn .badge{position:absolute;right:16px;top:10px;min-width:40px;height:40px;border-radius:20px;background:var(--pink);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;border:3px solid #fff}
.mbtn .tip{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:16px;color:var(--ink-soft);background:#fff;border-radius:8px;padding:2px 8px}

/* 로비 중앙: 현재 파티 4인 */
.lobby-party{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);display:flex;gap:30px;align-items:flex-end;z-index:2}
.lobby-party figure{margin:0;text-align:center}
.lobby-party img{height:420px;filter:drop-shadow(0 12px 10px rgba(60,40,120,.25));border-radius:20px}
.lobby-party figcaption{margin-top:8px;font-family:var(--f-title);font-size:26px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 18px;display:inline-block}
.lobby-party .empty{width:190px;height:420px;border:4px dashed rgba(143,134,217,.6);border-radius:30px;display:grid;place-items:center;font-size:24px;color:var(--lav-deep);background:rgba(255,255,255,.4)}

/* ---------- 공통 창(Window) ---------- */
.win{position:absolute;inset:0;background:radial-gradient(1200px 700px at 10% 0%,#ffeaf2 0,transparent 60%),radial-gradient(1200px 800px at 100% 100%,#e6efff 0,transparent 55%),#f6f2ff;display:flex;flex-direction:column;padding:28px 40px 34px;gap:22px}
.win-head{display:flex;align-items:center;gap:18px;height:84px}
.win-head .ico{width:92px;height:92px;margin:-10px 0}
.win-head h2{font-family:var(--f-title);font-weight:400;font-size:46px;margin:0;color:var(--ink)}
.win-head .sub{font-size:22px;color:var(--ink-soft);margin-left:6px}
.win-head .spacer{flex:1}
.x{width:76px;height:76px;border-radius:22px;border:3px solid var(--line);background:#fff;font-size:40px;line-height:1;color:var(--lav-deep);box-shadow:0 4px 0 var(--line)}
.mini-cur{display:flex;gap:12px}
.mini-cur span{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 16px 4px 6px;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.mini-cur img{width:40px;height:40px}

.panel{background:var(--paper);border:3px solid var(--line);border-radius:30px;box-shadow:0 6px 0 rgba(143,134,217,.12)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{border:3px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:8px 24px;font-size:22px;font-weight:700}
.tab[aria-selected="true"]{background:var(--lav);border-color:var(--lav);color:#fff}
.tab .n{font-size:17px;opacity:.85;margin-left:6px}
.btn{border:0;border-radius:20px;padding:14px 30px;font-size:24px;font-weight:900;background:var(--pink);color:#fff;box-shadow:0 5px 0 #e3607f}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lav-deep)}
.btn.ghost{background:#fff;color:var(--lav-deep);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn:disabled{background:#d7d3e6;box-shadow:0 5px 0 #c3bed6;cursor:not-allowed;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 14px;font-size:18px;font-weight:700;background:var(--lav-soft);color:var(--lav-deep)}
.chip.pink{background:var(--pink-soft);color:#e3557a}
.chip.gold{background:var(--gold-soft);color:#b07a12}
.chip.mint{background:#e2f6ec;color:#2f8f64}
.tbd{border:2px dashed #c9c2e8;color:#9a93bf;background:transparent}
.note-ex{position:absolute;right:130px;top:40px;font-size:18px;color:#9a93bf}

/* 속성 원형 아이콘 (아이콘 아트 나오기 전 임시) */
.attr{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;font-family:var(--f-title)}
.a-불{background:var(--fire)} .a-물{background:var(--water)} .a-얼음{background:var(--ice)} .a-풀{background:var(--grass)} .a-빛{background:var(--light)} .a-어둠{background:var(--dark)}

/* ---------- 아이템 슬롯 (인벤토리·가챠 결과 공용) ---------- */
.slot{position:relative;border-radius:24px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;transition:transform .12s}
.slot:hover{transform:translateY(-3px)}
.slot[aria-pressed="true"]{border-color:var(--lav);box-shadow:0 0 0 4px rgba(143,134,217,.3)}
.slot .art{width:84px;height:84px;display:grid;place-items:center}
.slot .art img{width:100%;height:100%;object-fit:contain}
.slot .nm{font-size:18px;font-weight:700;line-height:1.2}
.slot .cnt{position:absolute;right:10px;bottom:8px;font-size:18px;font-weight:900;color:var(--lav-deep);font-variant-numeric:tabular-nums}
.slot .cat{position:absolute;left:10px;top:8px;font-size:14px;color:var(--ink-soft)}
.slot.empty{background:rgba(255,255,255,.45);border-style:dashed}
.slot.c-currency{background:linear-gradient(#fffaf0,#fff)}
.portrait{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-title);font-size:34px;color:#fff;background:linear-gradient(135deg,#b7aef0,#8f86d9);border:3px solid #fff;box-shadow:0 0 0 3px var(--gold)}
.pers{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#c45b8a;background:var(--pink-soft)}
.fx{width:84px;height:84px;border-radius:50%;background:conic-gradient(from 20deg,#ffd1e6,#d9d2ff,#c7ecff,#ffeab8,#ffd1e6);display:grid;place-items:center;color:#6c62c4;font-weight:900;font-size:18px}

/* ---------- 인벤토리 ---------- */
.inv{display:grid;gap:24px;flex:1;min-height:0}
.inv.A{grid-template-columns:1fr}
.inv.B{grid-template-columns:1fr 440px}
.inv .gridbox{display:flex;flex-direction:column;gap:18px;padding:24px;min-height:0}
.inv .grid{display:grid;gap:16px;overflow:auto;padding:4px;align-content:start}
.inv.A .grid{grid-template-columns:repeat(8,1fr);grid-auto-rows:170px}
.inv.B .grid{grid-template-columns:repeat(6,1fr);grid-auto-rows:170px}
.inv .footer{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:var(--ink-soft)}
.detail{padding:30px;display:flex;flex-direction:column;gap:18px}
.detail .big{height:220px;border-radius:26px;background:linear-gradient(#fff,var(--lav-soft));display:grid;place-items:center}
.detail .big .art{transform:scale(1.6)}
.detail h3{font-family:var(--f-title);font-weight:400;font-size:38px;margin:0}
.detail p{font-size:20px;line-height:1.6;margin:0;color:var(--ink-soft)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;font-size:20px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-weight:700}
.hoverbar{display:flex;align-items:center;gap:20px;padding:14px 22px;border-radius:22px;background:var(--lav-soft);font-size:20px;min-height:64px}

/* ---------- 우편함 ---------- */
.mail{display:grid;gap:24px;flex:1;min-height:0}
.mail.A{grid-template-columns:720px 1fr}
.mail.B{grid-template-columns:1fr}
.mlist{display:flex;flex-direction:column;gap:14px;padding:22px;min-height:0}
.mlist .rows{display:flex;flex-direction:column;gap:12px;overflow:auto;padding:4px}
.mrow{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-radius:22px;border:3px solid var(--line);background:#fff;text-align:left;color:var(--ink)}
.mrow[aria-pressed="true"]{border-color:var(--lav);background:var(--lav-soft)}
.mrow.done{opacity:.6}
.mrow .mi{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;position:relative}
.mrow .mi.story{background:#fff4dc}
.mrow .mi.reward{background:var(--pink-soft)}
.mrow .dot{position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--pink);border:3px solid #fff}
.mrow b{font-size:22px;display:block}
.mrow small{font-size:17px;color:var(--ink-soft)}
.seal{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9fb4,#e2557a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);display:grid;place-items:center;color:#fff;font-family:var(--f-title);font-size:20px}
.gift{width:46px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--pink);position:relative}
.gift::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:6px;transform:translateX(-50%);background:var(--pink)}
.mview{padding:34px;display:flex;flex-direction:column;gap:20px;min-height:0}
.letter{flex:1;min-height:0;border-radius:24px;background:repeating-linear-gradient(#fffaf0 0 46px,#f4e9cf 46px 48px);border:3px solid #f0dfb4;padding:30px 40px;font-size:22px;line-height:48px;overflow:auto;position:relative}
.letter .from{font-family:var(--f-title);font-size:26px;color:#a2741c}
.rewards{display:flex;gap:18px;flex-wrap:wrap}
.reward{width:170px;padding:16px;border-radius:24px;background:#fff8f1;border:3px solid var(--pink-soft);text-align:center}
.reward img{width:84px;height:84px}
.reward b{display:block;font-size:20px}.reward span{font-size:18px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;overflow:auto;padding:4px;align-content:start}
.mcard{border-radius:28px;border:3px solid var(--line);background:#fff;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:left;color:var(--ink);min-height:250px}
.mcard.story{background:linear-gradient(#fffaf0,#fff);border-color:#f0dfb4}
.mcard.done{opacity:.6}
.mcard .env{height:120px;border-radius:18px;background:linear-gradient(160deg,#fff 0 50%,#fbefd2 50%);border:2px solid #f0dfb4;display:grid;place-items:center}

/* ---------- 모험가 모집(가챠) ---------- */
.gacha{display:grid;grid-template-columns:380px 1fr;gap:28px;flex:1;min-height:0}
.gside{display:flex;flex-direction:column;gap:16px}
.gtab{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:26px;border:3px solid var(--line);background:#fff;font-size:26px;font-weight:900;color:var(--ink);text-align:left}
.gtab[aria-selected="true"]{background:linear-gradient(90deg,var(--lav),#a99ff0);color:#fff;border-color:var(--lav)}
.gtab small{display:block;font-size:17px;font-weight:500;opacity:.8}
.gstage{position:relative;border-radius:34px;overflow:hidden;background:radial-gradient(600px 400px at 50% 40%,#fff 0,#efe9ff 50%,#d9cff9 100%);border:3px solid var(--line);display:flex;flex-direction:column}
.gstage .pool{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding:30px 34px;align-content:center}
.gstage .pool .slot{height:170px}
.gstage .pool .slot.unowned .art{filter:grayscale(1) brightness(1.6);opacity:.55}
.gfoot{display:flex;align-items:center;justify-content:space-between;padding:22px 34px;background:rgba(255,255,255,.7);border-top:3px solid var(--line)}
.pullbtn{min-width:260px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pullbtn small{font-size:17px;font-weight:700;opacity:.9}
.overlay{position:absolute;inset:0;background:rgba(40,30,80,.55);display:grid;place-items:center;z-index:20}
.result{width:1500px;padding:40px;border-radius:40px;background:radial-gradient(800px 400px at 50% 0,#fff,#f1ecff);text-align:center;display:flex;flex-direction:column;gap:26px}
.result h3{font-family:var(--f-title);font-weight:400;font-size:44px;margin:0}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.rcard{height:230px;perspective:900px}
.rcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.rcard.open .in{transform:rotateY(180deg)}
.rcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.rcard .back{background:linear-gradient(135deg,#a99ff0,#e8a6d8);border:4px solid #fff;color:#fff;font-family:var(--f-title);font-size:30px}
.rcard .front{transform:rotateY(180deg);background:#fff;border:3px solid var(--line)}
.rcard .front .nm{font-size:20px;font-weight:900}
@media (prefers-reduced-motion: reduce){ .rcard .in,.slot,.mbtn{transition:none} }

/* ---------- 모험가 생성 ---------- */
.create{display:grid;grid-template-columns:1fr 760px;gap:28px;flex:1;min-height:0}
.cview{position:relative;border-radius:34px;background:radial-gradient(500px 500px at 50% 45%,#fff,#ece6ff);border:3px solid var(--line);display:grid;place-items:center;overflow:hidden}
.cview .fig{height:820px}
.cview .tools{position:absolute;left:24px;top:24px;display:flex;gap:12px}
.sq{width:84px;height:84px;border-radius:22px;border:3px solid var(--line);background:#fff;font-size:38px;font-weight:900;color:var(--ink-soft);display:grid;place-items:center}
.sq[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:#fff}
.cview .facepic{position:absolute;right:24px;top:24px;width:170px;height:170px;border-radius:26px;border:4px solid #fff;box-shadow:0 0 0 3px var(--gold);object-fit:cover;background:#fff}
.cview .tag{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 20px;font-size:20px;color:var(--ink-soft)}
.cpanel{padding:26px 30px;display:flex;flex-direction:column;gap:18px;min-height:0;overflow:auto}
.step{border-radius:24px;border:3px solid var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:12px;background:#fff}
.step.stepnow{border-color:var(--lav)}
.step h4{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
.step h4 .no{width:36px;height:36px;border-radius:50%;background:var(--lav);color:#fff;display:grid;place-items:center;font-size:20px}
.step.done h4 .no{background:var(--mint)}
.picks{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center;font-size:20px}
.picks .opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:3px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;font-size:19px;font-weight:700;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:#fff}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.compare figure{margin:0;text-align:center;font-size:18px;color:var(--ink-soft)}
.compare .box{height:170px;border-radius:20px;background:var(--lav-soft);display:grid;place-items:center;overflow:hidden;border:3px solid var(--line)}
.compare .box img{height:100%;width:100%;object-fit:cover;object-position:top}
.nameinput{font-size:24px;padding:12px 18px;border-radius:18px;border:3px solid var(--line);font-family:inherit;color:var(--ink);width:100%}
.upload{display:flex;gap:12px;align-items:center;font-size:19px;color:var(--ink-soft)}
.upload label{cursor:pointer}

/* ---------- 모험가 도감 ---------- */
.codex{display:grid;grid-template-columns:520px 1fr 560px;gap:26px;flex:1;min-height:0}
.clist{padding:22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.clist .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;overflow:auto;padding:4px;align-content:start}
.acard{height:290px;border-radius:24px;border:3px solid var(--line);background:#fff;position:relative;overflow:hidden;padding:0}
.acard img{width:100%;height:100%;object-fit:cover;object-position:top}
.acard .lab{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;color:var(--ink)}
.acard[aria-pressed="true"]{border-color:var(--lav);box-shadow:0 0 0 4px rgba(143,134,217,.35)}
.acard.add{display:grid;place-items:center;font-size:70px;color:var(--lav);border-style:dashed;background:rgba(255,255,255,.5)}
.acard.add span{display:block;font-size:20px}
.cbig{border-radius:34px;background:radial-gradient(500px 500px at 50% 45%,#fff,#ece6ff);border:3px solid var(--line);display:grid;place-items:center;overflow:hidden}
.cbig img{height:860px}
.cinfo{padding:30px;display:flex;flex-direction:column;gap:18px}
.cinfo h3{font-family:var(--f-title);font-weight:400;font-size:44px;margin:0;display:flex;align-items:center;gap:14px}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.skill{height:130px;border-radius:22px;background:var(--lav-soft);display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--lav-deep);border:3px solid var(--line)}

/* ---------- 파티 설정 ---------- */
.party{display:grid;grid-template-columns:1fr 860px;gap:28px;flex:1;min-height:0}
.roster{padding:22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.search{display:flex;gap:12px}
.search input{flex:1;font-size:22px;padding:12px 18px;border-radius:18px;border:3px solid var(--line);font-family:inherit;color:var(--ink)}
.roster .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;overflow:auto;padding:4px;align-content:start}
.roster .acard{height:260px}
.roster .acard .inparty{position:absolute;right:8px;top:8px}
.formation{padding:26px;display:flex;flex-direction:column;gap:18px}
.slots4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pslot{height:330px;border-radius:26px;border:3px dashed #c9c2e8;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:22px;color:var(--lav);position:relative;overflow:hidden;padding:0}
.pslot.filled{border-style:solid;border-color:var(--line);background:#fff}
.pslot.sel{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,127,158,.3)}
.pslot img{width:100%;height:250px;object-fit:cover;object-position:top}
.pslot .pn{font-size:19px;font-weight:900;color:var(--ink)}
.pslot .no{position:absolute;left:10px;top:8px;font-size:16px;color:var(--ink-soft)}
.pslot .rm{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--pink);font-size:22px;box-shadow:0 2px 0 var(--line)}
.stat{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:21px}
.power{font-family:var(--f-title);font-size:40px;color:var(--lav-deep)}
.roles{display:flex;gap:8px;flex-wrap:wrap}
.role{padding:4px 14px;border-radius:999px;font-size:18px;font-weight:700;background:#f0eef7;color:#a8a3c2}
.role.on{background:var(--lav);color:#fff}
.skillrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.skillrow div{display:flex;gap:6px;justify-content:center}
.skillrow i{width:52px;height:52px;border-radius:14px;background:var(--lav-soft);border:2px solid var(--line);font-style:normal;font-size:14px;display:grid;place-items:center;color:var(--lav-deep);font-weight:700}

/* ---------- 스토리 도감 ---------- */
.storyb{display:grid;grid-template-columns:1fr 820px;gap:28px;flex:1;min-height:0}
.shelf{padding:24px;display:flex;flex-direction:column;gap:18px;min-height:0}
.scrolls{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;overflow:auto;padding:6px;align-content:start}
.scroll{position:relative;height:230px;border:0;background:none;padding:0;color:var(--ink)}
.scroll .paper{position:absolute;left:18px;right:18px;top:26px;bottom:26px;background:linear-gradient(90deg,#f9edd0,#fff8e6 30%,#fff8e6 70%,#f9edd0);border-left:2px solid #e9d29e;border-right:2px solid #e9d29e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.scroll::before,.scroll::after{content:"";position:absolute;left:4px;right:4px;height:30px;border-radius:15px;background:linear-gradient(#e7c27a,#c9963f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.scroll::before{top:6px}.scroll::after{bottom:6px}
.scroll b{font-size:22px;text-align:center;line-height:1.3}
.scroll small{font-size:17px;color:#a2741c;font-weight:700}
.scroll.locked .paper{background:#eeeaf7;border-color:#d8d2ea;color:#a8a3c2}
.scroll.locked::before,.scroll.locked::after{background:linear-gradient(#cfc9e2,#b4add0)}
.scroll[aria-pressed="true"] .paper{box-shadow:0 0 0 4px var(--lav)}
.scroll .new{position:absolute;right:14px;top:30px;z-index:2}
.reader{padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.reader header{padding:26px 34px 14px;border-bottom:3px dashed #f0dfb4;background:#fffaf0}
.reader header small{color:#a2741c;font-size:19px;font-weight:700}
.reader header h3{margin:4px 0 0;font-family:var(--f-title);font-weight:400;font-size:40px}
.reader .body{flex:1;overflow:auto;padding:26px 40px;font-size:22px;line-height:1.85;white-space:pre-line;background:#fffdf7}
.reader .lockmsg{flex:1;display:grid;place-items:center;font-size:24px;color:var(--ink-soft);text-align:center;padding:40px}


/* ---------- 로비 배틀 영역 (시스템팀 구현 자리) ---------- */
.bbg{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.bbg-tint{position:absolute;inset:0;pointer-events:none}
.bbg-tint.ruin{background:linear-gradient(180deg,rgba(255,140,120,.35),rgba(120,70,110,.35));mix-blend-mode:multiply}

const STORY = [{"id": "p", "ch": 0, "round": 0, "label": "기본 제공", "title": "프롤로그 · 새로운 모험가", "text": "해가 지고 있었다. 마을을 붉게 물들이던 햇빛이 산 너머로 천천히 모습을 감추고 있었다. 이른 아침부터 북적이던 시장은 하나 둘 문을 닫기 시작했고, 상인들은 남은 물건을 정리하며 서둘러 가게의 문을 내렸다. 하지만 마을 중앙에 자리한 거대한 여관은 지금부터 북적이기 시작했다.\n\n용의 횃불에서 가장 크고 유명한 여관이자 주점. 여행자들이 머물고, 상인들이 거래를 나누며, 모험가들이 새로운 동료와 의뢰를 찾는 곳. 대부분의 사람들에게는 하루를 마친 뒤 술 한 잔을 기울이는 곳이었지만, 모험가들에게는 그 의미가 달랐다.\n\n새로운 소문이 시작되는 곳.\n\n새로운 의뢰가 들어오는 곳.\n\n그리고 누군가의 모험이 시작되는 곳.\n\n그날 저녁도 용의 술잔을 사람들로 가득했다. 잔이 부딪히는 소리와 웃음소리, 오래된 모험담을 늘어놓는 목소리가 뒤섞여 여관 전체를 울렸다.\n\n“그래서 말이야. 그 동굴의 끝에서 진짜로 보물을 발견했다니까!”\n\n“네가 보물이라 부르는 그것은 낡은 냄비가 아니고?”\n\n“그.. 그건 고대의 유물이었어!”\n\n곳곳에서 웃음이 터졌다. 당신도 그 소란 속에 있었다. 특별한 목적이 있어서 온 것이 아니었다. 그저 따분한 하루를 술 한 잔에 기울이기 위해 우연히 들른 것에 가까웠다. 아직 모험가라고 부를 만한 경험도 없었다. 그저 여린 마물들이 나오는 작은 동굴을 몇 번 가보았을 뿐, 검을 제대로 다뤄본 적도 없었고, 마법을 배운 적도 없었다. 누군가에게 자랑할 만한 업적도 없었다. 당신은 잔을 내려놓고 주변을 둘러보았다. 여관 한쪽 벽에는 커다란 나무 게시판이 걸려 있었다. 수 많은 종이가 빼곡하게 붙어있는 모험가 게시판이었다.\n\n[마물 토벌에 협조해주실 분을 찾습니다]\n\n[빛나는 약초를 채집해주실 분을 찾습니다]\n\n[분실된 물건을 찾아주실 분을 찾습니다]\n\n당신은 그 앞에서 천천히 게시판을 훑어보았다. 익숙한 의뢰들이었다. 평소라면 대충 훑어보고 지나쳤을 것이다.\n\n그러던 중—\n\n유독 눈에 들어오는 종이 한 장이 있었다. 다른 의뢰서보다 크고 깔끔한 종이였다. 상단에는 굵은 글씨로 적혀있었다. [마력 균열 탐험 모험가 모집]\n\n당신의 시선이 그 문구에서 멈췄다. 이윽고 당신의 시선이 자연스럽게 종이 아래로 내려갔다.\n\n최근 용의 횃불 인근에서 발견된 마력 균열의 탐험에 함께할 모험가를 모집합니다. 균열 내부에는 강력한 마물과 희귀한 유물 및 자원이 존재합니다. 경험이 없는 신입 모험가도 지원 가능합니다. 탐험과 성장을 함께할 새로운 모험가를 기다립니다. - 카이렌 모험가 길드 -\n\n“카이렌 모험가 길드....?”\n\n당신은 작게 중얼거린다.\n\n카이렌.\n\n어디선가 들어본 이름이었다. 최근 마력 균열을 탐험하며 이름을 알린 유명한 모험가. 그가 새로운 길드를 만들었다는 소문도 들었던 것 같다. 하지만 이상했다.\n\n유명한 모험가라면 실력 좋은 모험가들만 모아도 충분할 텐데 왜 굳이 경험 없는 신입까지 모집하는 걸까? 얼마 전부터 새로운 길드를 만들기 위해 사람을 모으고 있다는 소문이 돌고 있었지만, 이 소문이 사실이라니.\n\n그리고 그때—\n\n“그 모집 공고가 마음에 드나?”\n\n등 뒤에서 목소리가 들렸다. 당신은 돌아보았다. 조금 전까지 다른 모험가들과 이야기를 나누고 있던 남자가 이쪽을 바라보고 있었다.\n\n어깨에 자연스럽게 걸친 망토.\n\n허리춤에 메인 검.\n\n모험에 맞춰 갖춘 단정한 장비.\n\n그 얼굴을 알아보는 데는 그리 오래 걸리지 않았다.\n\n카이렌.\n\n당신은 다시 게시판을 바라보았다. 그리고 다시 그를 바라보았다.\n\n“혹시...”\n\n카이렌이 웃었다.\n\n“맞아.”\n\n그가 게시판의 모집 공고를 가리켰다.\n\n“그거 내가 붙인거야.”\n\n카이렌은 여관의 빈자리 하나를 가리키며 말했다.\n\n“여기 앉아.”\n\n당신이 자리에 앉자 카이렌도 맞은편에 앉았다.\n\n“그래서?”\n“모험가가 되고 싶은 건가?”\n\n당신은 잠시 고민하다 대답했다.\n\n“아직은... 잘 모르겠습니다.”\n\n솔직한 대답이었다. 카이렌은 오히려 그 말을 듣고 웃었다.\n\n“그게 정상이지”\n“처음부터 모험가가 되고 싶다고 확신하는 사람이 얼마나 되겠어?”\n\n그는 테이블 위의 잔을 손가락으로 가볍게 돌렸다.\n\n“하지만 균열은 기다려주지 않아.”\n\n카이렌의 표정이 조금 진지해졌다.\n\n“최근 용의 횃불 주변에서 균열이 계속 발견되고 있다.”\n“처음에는 작은 균열이라고 생각했지.”\n“그런데 조사할수록 이상한 점이 발견되고 있어.”\n\n당신이 물었다.\n\n“어떤 점이요?”\n\n카이렌은 잠시 침묵한 뒤, 말했다.\n\n“서로 다른 장소에서 발견된 균열인데...”\n\n그가 낮게 말했다.\n\n“같은 흔적이 발견 돼.”\n\n그 말은 이상하게 오래 머릿속에 남았다. 카이렌은 다시 평소의 표정으로 돌아왔다.\n\n“그래서 길드를 만들었어”\n“균열을 직접 탐험하고 조사할 사람들을 모으려고.”\n\n그리고 당신을 바라보았다.\n\n“물론 위험한 일이야.”\n“강한 마물도 만나게 될 거고.”\n“목숨이 위험해질 수도 있지.”\n\n당신은 아무 말도 하지 않았다.\n\n하지만 이상하게도—\n\n두렵기보다는 궁금했다.\n\n저 균열 안에는 무엇이 있는지.\n\n왜 균열이 생겨나는지.\n\n그리고 카이렌이 말한 <같은 흔적>이 무엇인지.\n\n카이렌이 물었다.\n\n“그래도 해볼 생각인가?”\n\n당신은 잠시 생각한 뒤, 그리고 고개를 끄덕였다. 카이렌은 만족스럽게 웃었다.\n\n“좋아.”\n\n그가 손을 내밀었다.\n\n“환영한다. 카이렌 모험가 길드에.”\n\n당신이 그의 손을 잡았다. 창밖으로 마지막 햇빛이 사라지고 있었다. 용의 횃불의 거리가 어둠에 잠기기\n\n시작했다.\n\n아무것도 아니었던 하루가—\n\n당신의 인생에서 가장 긴 모험의 첫날로 바뀌었다."}, {"id": "1-0", "ch": 1, "round": 0, "label": "스테이지 시작", "title": "들판", "text": "다음 날 아침. 용의 횃불의 동쪽 문을 빠져나오자 넓은 들판이 펼쳐졌다.\n\n맑은 하늘.\n\n멀리 이어진 산맥.\n\n바람에 흔들리는 풀.\n\n곳곳에 자라난 나무.\n\n그리고 들판 위를 천천히 날아다니는 작은 나비 한 마리.\n\n평화로운 풍경이었다.\n\n너무 평화로워서 어제 카이렌이 했던 말이 거짓말처럼 느껴질 정도였다.\n\n“저기다.”\n\n카이렌이 손가락으로 앞을 가리켰다. 멀리서 공기가 일그러지고 있었다. 마치 투명한 천을 잡아당긴 것처럼 공간 한가운데가 뒤틀려 있었다. 균열이었다. 가까이 다가갈수록 피부에 미세한 전류가 흐르는 듯한 감각이 느껴졌다. 카이렌이 당신을 바라보았다.\n\n“처음 보는 균열이지?”\n\n당신이 고개를 끄덕였다.\n\n“기억해 둬.”\n\n그가 균열을 바라보았다.\n\n“균열은 겉모습만 보고 판단하면 안 된다.”\n“안으로 들어가면 지금 보는 풍경과는 전혀 다른 모습을 보여줄 수도 있으니까.”\n\n당신은 무기를 고쳐 잡았다. 그리고 균열 안으로 들어갔다."}, {"id": "1-2", "ch": 1, "round": 2, "label": "1-2 클리어", "title": "첫 번째 마물", "text": "균열 내부는 이상했다. 들판과 비슷한 풍경이었지만 어딘가 달랐다. 풀 사이로 희미한 마력이 빛났고, 하늘에는 설명하기 어려운 빛의 입자가 떠다녔다.\n\n멀리 산이 보였다.\n\n나무가 바람에 흔들렸다.\n\n하늘은 맑고 푸르렀다.\n\n심지어 작은 나비 한 마리까지 꽃 사이를 날아다니고 있었다.\n\n당신은 생각보다 평화로운 풍경에 조금 긴장을 풀었다.\n\n“생각보다 별거 없는데요?”\n\n카이렌이 웃었다.\n\n“아직은.”\n\n그가 손으로 주변을 가리켰다.\n\n“균열은 깊이 들어갈수록 마력이 강해져.”\n\n“그럼 저희는 어디까지…”\n\n그 순간이었다. 풀숲이 크게 흔들렸다. 당신은 본능적으로 무기를 들어 올렸다.\n\n통통.\n\n무언가가 풀 사이에서 튀어나왔다.\n\n둥글고 말랑한 몸.\n\n반투명한 피부.\n\n당신과 그것의 눈이 마주쳤다.\n\n슬라임.\n\n잠시 정적이 흘렀다. 당신이 말했다.\n\n“……”\n\n카이렌이 웃음을 참으며 말했다.\n\n“왜?”\n\n“첫 상대치고는…”\n\n당신이 슬라임을 바라봤다.\n\n“귀엽잖아요.”\n\n“방심하지 마.”\n\n슬라임이 갑자기 몸을 낮췄다.\n\n그리고—\n\n퐁!\n\n당신을 향해 튀어 올랐다.\n\n“어?”\n\n당신은 황급히 몸을 피했다. 슬라임이 바닥에 떨어졌다. 당신도 무기를 휘둘렀다. 하지만 첫 공격은 빗나갔다.\n\n“이런…”\n\n슬라임이 다시 달려들었다.\n\n두 번째 공격.\n\n이번에는 간신히 스쳤다. 슬라임의 몸이 출렁였다.\n\n카이렌이 외쳤다.\n\n“좋아! 계속해!”\n\n당신은 숨을 고르고 자세를 잡았다.\n\n세 번째 공격.\n\n정확히 슬라임의 중심을 때렸다. 슬라임의 몸이 크게 흔들렸다.\n\n그리고—\n\n작은 빛으로 흩어졌다. 전투가 끝났다. 당신은 잠시 멍하니 서 있었다. 바닥에는 작은 마력 조각 하나가 남아 있었다. 당신이 그것을 집어 들었다. 카이렌이 말했다.\n\n“축하한다.”\n\n“뭐가요?”\n\n“첫 번째 마물 토벌.”\n\n당신은 손에 든 마력 조각을 바라보았다. 별것 아닌 것처럼 보이는 작은 조각이었다. 하지만 이상하게 기분이 좋았다. 카이렌이 말했다.\n\n“모든 모험가는 처음엔 그렇게 시작해.”\n\n얼마 지나지 않아 두 번째 슬라임이 나타났다. 이번에는 조금 전보다 쉽게 상대할 수 있었다. 당신은 첫 번째 공격부터 정확하게 명중시켰다. 카이렌이 말했다.\n\n“조금 전보다 빨라졌네.”\n\n“그런가요?”\n\n“네가 방금 전투에서 배운 거야.”\n\n카이렌은 균열 안쪽을 바라보았다.\n\n“전투는 단순히 적을 쓰러뜨리는 게 아니야.”\n“한 번의 싸움이 다음 싸움을 위한 경험이 되지.”\n\n당신은 손에 든 무기를 바라보았다. 조금 전까지만 해도 낯설었던 무기가 이제는 조금 익숙하게 느껴졌다."}, {"id": "1-4", "ch": 1, "round": 4, "label": "1-4 클리어", "title": "들판의 이상징후", "text": "균열 안쪽으로 들어갈수록 풍경은 조금씩 달라졌다. 나무가 많아졌고, 풀도 훨씬 무성해졌다. 하지만 마물의 수도 늘어났다. 처음에는 슬라임만 나타났지만 이제는 다른 종류의 마물도 나타나기 시작했다. 숲 가장자리에서 거대한 곰이 모습을 드러냈다. 당신이 공격하자 곰은 뒤로 밀려났다.\n\n하지만—\n\n잠시 후 곰의 몸에서 강한 마력이 솟아올랐다. 낮게 으르렁거리는 소리. 그리고 붉게 빛나는 눈. 카이렌의 표정이 바뀌었다.\n\n“조심해.”\n\n곰이 갑자기 달려들었다. 아까보다 훨씬 빨랐다. 당신은 간신히 공격을 피했다.\n\n“방금 전보다 빨라졌는데요?”\n\n“마력이 폭주한 거야.”\n\n곰의 공격을 피하고 반격한다.\n\n한 번.\n\n두 번.\n\n마침내 곰이 쓰러졌다.\n\n당신이 숨을 고르는 순간—\n\n바닥이 꿈틀거렸다.\n\n“뭐지?”\n\n풀 사이에서 긴 몸이 튀어나왔다. 지렁이 형태의 마물이었다. 당신이 공격하려 하자 지렁이는 곰의 몸 쪽으로 기어갔다. 그리고 이상한 빛을 내뿜었다. 쓰러져가던 곰의 몸이 조금씩 회복되기 시작했다. 당신이 놀랐다.\n\n“저게 치료한 거예요?”\n\n카이렌이 고개를 끄덕였다.\n\n“마물을 회복시키는 종류가 있지.”\n\n“그럼 먼저 저걸…”\n\n“맞아.”\n\n카이렌이 웃었다.\n\n“이제 조금 모험가답게 생각하는데?”\n\n전투가 끝났다. 당신은 주위를 둘러보았다. 이곳은 처음 들어왔을 때의 평화로운 들판과 같아 보였다. 하지만 이제는 달랐다. 평범한 자연처럼 보이는 곳곳에 이상한 마력이 흐르고 있었다. 그때 카이렌이 걸음을 멈췄다.\n\n“잠깐.”\n\n그는 풀 사이에 손을 넣었다. 그리고 작은 돌 하나를 꺼냈다. 돌 표면에는 이상한 문양이 새겨져 있었다. 당신이 물었다.\n\n“그게 뭔데요?”\n\n카이렌은 대답하지 않았다. 한참 동안 돌을 바라보았다.\n\n“……이 문양.”\n\n“알아요?”\n\n“정확하게는 몰라.”\n\n카이렌이 돌을 뒤집었다.\n\n“하지만 본 적은 있어.”\n\n“어디서요?”\n\n카이렌이 당신을 바라보았다.\n\n“다른 균열에서.”"}, {"id": "1-5", "ch": 1, "round": 5, "label": "1-5 클리어", "title": "균열의 흔적", "text": "그날의 탐험을 잠시 멈추고 카이렌은 주변을 살폈다. 그는 평소보다 말이 없었다. 당신은 손에 든 돌을 바라보았다. 돌에서는 무언가의 문양이 빛나고 있었다. 하지만 이상하게 눈을 뗄 수 없었다.\n\n“이게 그렇게 중요한 거예요?”\n\n카이렌이 말했다.\n\n“아직은 몰라.”\n\n“그런데 왜…”\n\n“이런 문양의 돌이 발견된 적이 한두 번이 아니거든.”\n\n카이렌은 돌을 품 안에 넣었다.\n\n“처음 발견한 건 몇 달 전이었어.”\n\n“어디서요?”\n\n“용의 횃불에서 꽤 멀리 떨어진 균열.”\n\n그는 잠시 말을 멈췄다.\n\n“그때도 똑같은 문양이 있었어.”\n\n당신은 주변을 바라보았다.\n\n햇빛.\n\n나무.\n\n풀.\n\n나비.\n\n평화로운 풍경.\n\n그런데 이 모든 것 아래에 자신들이 모르는 무언가가 묻혀 있는 것 같았다.\n\n그 순간—\n\n멀리서 무언가가 울부짖었다. 평범한 마물의 소리가 아니었다. 땅이 미세하게 흔들렸다. 카이렌이 검을 뽑았다.\n\n“뒤로 물러나.”\n\n“뭔데요?”\n\n“아마…”\n\n그가 균열 깊은 곳을 바라보았다.\n\n“우리가 찾던 답 중 하나가 저 안에 있을 거야.”"}, {"id": "1-7", "ch": 1, "round": 7, "label": "1-7 클리어", "title": "슬라임 왕 등장", "text": "풀들이 갑자기 사방으로 쓰러졌다. 푸른 마력이 지면을 타고 흘렀다. 그리고 거대한 그림자가 모습을 드러냈다. 수많은 슬라임이 하나로 뭉친 듯한 거대한 몸. 머리 위에는 왕관처럼 솟아오른 마력 결정. 슬라임 왕.\n\n당신은 자신도 모르게 뒤로 한 걸음 물러났다.\n\n“저게…”\n\n카이렌이 검을 뽑았다.\n\n“균열의 마력이 강하게 모인 곳에는 저런 놈도 나타나.”\n\n슬라임 왕이 몸을 크게 부풀렸다. 그리고 바닥을 내리쳤다.\n\n쿵!\n\n충격이 들판 전체로 퍼졌다. 당신은 몸을 굴려 공격을 피했다.\n\n카이렌이 외쳤다.\n\n“몸통을 노려!”\n\n당신은 공격을 이어갔다. 조금 전의 슬라임과는 비교할 수 없었다. 하지만 지금의 당신도 처음과는 달랐다. 전투를 반복하며 익숙해진 움직임. 강화된 능력.\n\n그리고 무엇보다—\n\n싸우는 방법을 알고 있었다. 마침내 슬라임 왕의 몸에 금이 가기 시작했다.\n\n“지금이야!”\n\n마지막 공격.\n\n거대한 몸이 무너졌다.\n\n당신은 숨을 고르며 검을 내렸다.\n\n“끝난…”\n\n그 순간.\n\n카이렌의 표정이 굳었다.\n\n“아직이야.”\n\n무너진 슬라임 왕의 몸에서 작은 빛들이 튀어나왔다.\n\n하나.\n\n둘.\n\n셋.\n\n그리고—\n\n수많은 작은 슬라임.\n\n분열.\n\n“이것까지 전부?”\n\n“그래!”\n\n당신은 다시 무기를 들었다. 작은 슬라임들이 사방으로 흩어졌다.\n\n한 마리.\n\n두 마리.\n\n세 마리.\n\n하나씩 쓰러뜨릴 때마다 또 다른 슬라임이 달려들었다. 긴 전투 끝에 마지막 슬라임이 빛으로 사라졌다. 당신은 바닥에 주저앉았다.\n\n“……진짜 끝난 거죠?”\n\n카이렌이 웃었다.\n\n“이번엔 진짜야.”\n\n그리고 그는 슬라임 왕이 있던 자리를 바라보았다. 그곳에는 유물이 하나 놓여 있었다. 빛나는 큰 결정. 카이렌이 그것을 집어 들었다. 문양이 새겨져 있었다. 아까 발견한 돌과 똑같은 문양이 그려져 있었다. 카이렌의 표정이 굳었다.\n\n“역시.”\n\n“무슨 일이죠?”\n\n“이건 우연이 아니야.”"}, {"id": "1-9", "ch": 1, "round": 9, "label": "1-9 클리어", "title": "오래된 기록", "text": "유물을 얻은 뒤에도 카이렌은 한동안 움직이지 않았다. 그는 주변을 살폈다. 그리고 들판 한쪽의 바위 뒤에서 이상한 것을 발견했다. 오래된 석판이었다. 절반은 땅에 묻혀 있었고, 나머지 절반도 이끼와 흙으로 뒤덮여 있었다. 당신이 함께 석판을 꺼냈다. 표면에는 오래된 문자가 새겨져 있었다. 카이렌이 천천히 읽기 시작했다.\n\n“……균열.”\n\n“읽을 수 있어요?”\n\n“옛 문자긴 하지만 기본적인 건 알아.”\n\n그는 손가락으로 문장을 따라갔다.\n\n‘균열은 마력을 먹고 자란다.’\n\n당신은 그 문장을 바라보았다.\n\n“마력을 먹는다고요?”\n\n“비유인지 진짜 의미인지는 모르겠어.”\n\n카이렌은 다음 문장을 읽었다. 그러나 그 부분은 심하게 깨져 있었다. 몇 글자만 남아 있었다.\n\n‘마력이 모이면…… 깊어지고……’\n\n그리고 그 아래.\n\n‘핵에 이르러서는……’\n\n그 이후는 완전히 사라져 있었다. 당신이 물었다.\n\n“이걸 누가 남긴 거죠?”\n\n카이렌이 대답했다.\n\n“모르겠어.”\n\n그는 석판을 바라보았다.\n\n“하지만 이곳에 우리가 오기 훨씬 전부터 균열을 조사한 사람들이 있었다는 건 확실해.”\n\n그리고 그는 유물을 꺼냈다.\n\n석판의 문양과 유물의 문양이 정확히 맞아떨어졌다.\n\n“이 사람들은 균열을 알고 있었어.”\n\n“그런데 왜 아무도 모르는 거죠?”\n\n카이렌은 잠시 침묵했다.\n\n“아마…”\n\n그가 말했다.\n\n“기록이 남지 않았거나.”\n\n“남길 수 없었거나.”"}, {"id": "1-10", "ch": 1, "round": 10, "label": "1-10 클리어", "title": "빛의 수호자", "text": "균열의 가장 깊은 곳. 그곳은 지금까지 지나온 들판과 전혀 달랐다.\n\n나무도.\n\n풀도.\n\n바위도.\n\n모두 희미한 빛에 잠겨 있었다. 중앙에는 한 마리의 유니콘이 서 있었다. 눈처럼 하얀 몸. 길게 뻗은 뿔. 그리고 몸 주변을 감싸고 있는 빛의 마력. 당신은 잠시 넋을 잃었다.\n\n“예쁘다…”\n\n카이렌이 낮게 말했다.\n\n“그래.”\n\n하지만 그의 표정은 편하지 않았다.\n\n“저런 마력을 가진 마물이 이곳 가장 깊은 곳에 있다는 건…”\n\n유니콘이 천천히 고개를 들었다. 붉은빛이 눈동자를 스쳤다.\n\n그리고—\n\n순간적으로 사라졌다.\n\n“뭐?”\n\n다음 순간. 유니콘이 눈앞까지 돌진했다.\n\n쾅!\n\n당신은 간신히 몸을 피했다. 땅이 깊게 파였다. 카이렌이 외쳤다.\n\n“돌진한다! 움직임을 보고 피해야 해!”\n\n유니콘이 다시 몸을 돌렸다.\n\n두 번째 돌진.\n\n세 번째.\n\n당신은 계속해서 피했다.\n\n그리고 빈틈을 찾아 공격했다.\n\n긴 전투 끝에 유니콘이 쓰러졌다.\n\n그 순간. 주변의 빛이 사라졌다. 그리고 유니콘 뒤에 있던 공간이 갈라졌다. 그 안에서 거대한 마력핵이 모습을 드러냈다. 주황빛의 핵. 카이렌이 천천히 다가갔다. 마력핵에서 한 줄기의 빛이 뻗어 나갔다.\n\n북쪽.\n\n멀리 있는 산맥을 향해. 카이렌이 말했다.\n\n“다음 균열은…”\n\n당신도 그 방향을 바라보았다. 끝없이 이어진 산. 그 위를 덮은 하얀 눈. 카이렌이 말했다.\n\n“설산이야.”"}, {"id": "2-0", "ch": 2, "round": 0, "label": "스테이지 시작", "title": "설산", "text": "용의 횃불 북쪽. 산맥을 따라 올라갈수록 공기는 차가워졌다. 나무에는 눈이 쌓여 있었고, 거대한 빙산이 산 사이에 솟아 있었다. 바닥은 얼어붙어 있었다. 하늘은 들판에서 보았던 푸른색과 달랐다.\n\n짙은 남색.\n\n그리고 하늘에서 작은 눈송이가 천천히 떨어지고 있었다. 당신은 외투를 여미었다."}, {"id": "2-2", "ch": 2, "round": 2, "label": "2-2 클리어", "title": "설산 속에 남은 흔적", "text": "“여기에도 균열이 있는 거죠?”\n\n카이렌이 말했다.\n\n“그래.”\n\n그가 앞을 가리켰다. 눈보라 너머로 공간이 일그러져 있었다. 당신은 균열 안으로 들어갔다. 그 순간 발밑의 눈이 푹 꺼졌다. 당신은 멈췄다. 눈 위에 발자국이 있었다. 사람의 발자국. 한 사람이 아니었다. 여러 명이었다. 카이렌이 무릎을 꿇고 그 발자국을 유심히 들여다 봤다.\n\n“탐험대야.”\n\n“최근에 지나간 건가요?”\n“아니.”\n\n그는 눈을 걷어냈다. 오래된 장비의 일부가 드러났다.\n\n“꽤 오래됐어.”\n\n당신은 발자국이 이어지는 방향을 바라보았다.\n\n산 안쪽.\n\n그런데 이상했다.\n\n발자국은 계속 이어져 있었지만—\n\n돌아오는 발자국은 없었다.\n\n그때.\n\n멀리서 늑대의 울음소리가 들렸다. 눈밭을 가르며 늑대들이 달려왔다. 그리고 하늘에서는 작은 마물들이 날아들었다.\n\n모기.\n\n카이렌이 말했다.\n\n“설산에 온 걸 환영한다.”"}, {"id": "2-4", "ch": 2, "round": 4, "label": "2-4 클리어", "title": "얼음 아래의 기록", "text": "전투가 끝난 뒤 당신은 조금 전의 발자국을 다시 살펴보았다. 눈 아래에 무언가가 묻혀 있었다. 파내자 낡은 배낭이 나왔다. 안에는 얼어붙은 기록장이 들어 있었다. 카이렌이 조심스럽게 펼쳤다.\n\n첫 페이지.\n\n날짜.\n\n그리고 탐험대의 이름.\n\n몇 장을 넘기자 익숙한 단어가 나타났다.\n\n마력 균열.\n\n당신이 가까이 다가갔다. 카이렌이 읽었다.\n\n‘들판에서 발견한 균열과 이곳의 균열 사이에서 동일한 문양이 발견되었다.’\n\n당신은 숨을 멈췄다.\n\n“들판…”\n\n카이렌이 다음 페이지를 넘겼다.\n\n‘두 균열은 서로 다른 장소에 존재하지만, 내부의 마력 흐름에는 유사성이 있다.’\n\n그리고 마지막 기록.\n\n‘어쩌면 우리가 조사하고 있는 것은 두 개의 균열이 아니라……’\n\n그 뒤는 찢겨 있었다. 카이렌이 기록장을 덮었다.\n\n“여기서부터 기록이 없어.”\n\n“그럼 이 사람들은…”\n\n카이렌은 대답하지 않았다. 대신 눈밭을 바라보았다. 아무도 돌아오지 않았다."}, {"id": "2-5", "ch": 2, "round": 5, "label": "2-5 클리어", "title": "얼음 아래의 이무기", "text": "산 깊은 곳. 빙판 아래에서 물소리가 들렸다. 당신은 발걸음을 멈췄다.\n\n“여긴 전부 얼어붙은 것 같은데…”\n\n카이렌이 말했다.\n\n“그래서 이상한 거야.”\n\n콰앙!\n\n얼음이 갈라졌다. 거대한 물기둥이 솟구쳤다. 그 안에서 긴 몸이 모습을 드러냈다.\n\n푸른 비늘.\n\n거대한 뿔.\n\n얼음 아래를 헤엄치듯 움직이는 거대한 마물.\n\n이무기.\n\n이무기가 입을 벌렸다.\n\n그리고—\n\n엄청난 양의 물이 한꺼번에 쏟아졌다.\n\n“피해!”\n\n당신과 카이렌이 양옆으로 흩어졌다. 물줄기가 바위를 그대로 부숴버렸다. 카이렌이 말했다.\n\n“정면으로 맞으면 버티기 힘들어!”\n\n당신은 공격을 이어갔다. 이무기는 계속해서 물대포를 쏟아냈다.\n\n몇 차례의 공격 끝에—\n\n마침내 거대한 몸이 얼음 위로 쓰러졌다. 그 아래에서 유물이 나타났다. 당신은 이미 알고 있었다. 같은 문양."}, {"id": "2-7", "ch": 2, "round": 7, "label": "2-7 클리어", "title": "균열의 기억", "text": "유물을 손에 쥔 순간. 시야가 흔들렸다. 눈앞의 설산이 사라졌다. 대신 오래전의 사람들이 나타났다. 그들은 균열을 연구하고 있었다. 커다란 장치가 균열의 중심에 설치되어 있었다. 한 사람이 말했다.\n\n“조금만 더 마력을 끌어올리면 됩니다.”\n\n다른 사람이 말했다.\n\n“핵이 불안정해지고 있어.”\n\n하지만 실험은 멈추지 않았다. 더 많은 마력이 균열 안으로 흘러들어갔다.\n\n그리고—\n\n폭발.\n\n사람들이 도망쳤다.\n\n균열이 흔들렸다.\n\n마물이 쏟아져 나왔다.\n\n환영은 거기에서 끝났다.\n\n당신은 숨을 몰아쉬며 눈을 떴다. 카이렌이 당신을 붙잡았다.\n\n“괜찮아?”\n\n당신은 고개를 끄덕였다.\n\n“방금… 사람들이 균열을 건드리고 있었어요.”\n\n카이렌의 표정이 어두워졌다.\n\n“그래.”\n\n“그 사람들이 균열을 만든 건가요?”\n\n카이렌은 잠시 생각했다.\n\n“아니.”\n\n그가 유물을 바라보았다.\n\n“내 생각에는 균열은 원래 존재했어.”\n“하지만…”\n\n카이렌이 말을 이었다.\n\n“그들이 균열의 힘을 이용하려고 했고.”\n“그 과정에서 균열을 불안정하게 만든 거야.”"}, {"id": "2-9", "ch": 2, "round": 9, "label": "2-9 클리어", "title": "설산의 수호자", "text": "설산 깊은 곳. 갑자기 눈보라가 몰아쳤다. 앞이 보이지 않을 정도로 눈이 쏟아졌다. 당신은 팔로 얼굴을 가렸다.\n\n“카이렌!”\n\n대답이 없었다. 눈보라 사이에서 거대한 그림자가 움직였다.\n\n한 걸음.\n\n두 걸음.\n\n그리고—\n\n거대한 존재가 모습을 드러냈다.\n\n설인.\n\n설인이 거대한 눈덩이를 집어 들었다.\n\n당신이 피하려는 순간—\n\n퍽!\n\n눈덩이가 몸에 부딪혔다. 몸이 무거워졌다. 움직임이 느려졌다. 카이렌의 목소리가 들렸다.\n\n“공격 속도가 떨어졌어!”\n\n당신은 이를 악물고 움직였다. 설인의 공격을 피하고, 천천히 거리를 좁혔다.\n\n그리고 마침내—\n\n설인이 쓰러졌다. 눈보라가 멈췄다. 그 뒤에 있던 균열이 모습을 드러냈다. 카이렌이 말했다.\n\n“여기에도 그 돌이 있어.”"}, {"id": "2-10", "ch": 2, "round": 10, "label": "2-10 클리어", "title": "주황빛", "text": "마력 핵에서 빛이 흘러나왔다. 이번에도 한 방향이었다.\n\n남쪽.\n\n카이렌이 지도를 펼쳤다.\n\n“저쪽에는 오래된 마을이 하나 있어.”\n\n“사람이 살고 있나요?”\n\n카이렌은 대답하지 않았다.\n\n잠시 후.\n\n“아마 지금은 아닐 거야.”\n\n당신은 그를 바라보았다.\n\n“왜요?”\n\n카이렌이 지도를 접었다.\n\n“기록에 그 마을 이야기가 있었어.”\n\n그리고 짧게 말했다.\n\n“균열 연구가 이루어졌던 곳이야.”"}, {"id": "3-0", "ch": 3, "round": 0, "label": "스테이지 시작", "title": "폐허", "text": "남쪽으로 향하는 동안 풍경은 점점 황폐해졌다. 푸른 나무는 줄어들었다. 풀도 사라졌다.\n\n그리고 마침내—\n\n붉은 노을 아래 검게 그을린 마을이 모습을 드러냈다.\n\n부서진 나무집.\n\n쓰러진 나무.\n\n무너진 울타리.\n\n재가 쌓인 돌.\n\n낡은 농기구.\n\n아무도 없는 거리.\n\n바람이 불 때마다 재가 천천히 날렸다."}, {"id": "3-2", "ch": 3, "round": 2, "label": "3-2 클리어", "title": "아무도 없는 마을", "text": "당신은 한 걸음씩 마을 안으로 들어갔다.\n\n“사람이 정말 아무도 없네요.”\n\n카이렌이 대답했다.\n\n“그래.”\n\n그의 목소리는 평소보다 낮았다. 어느 집 안으로 들어가자 낡은 식탁이 있었다. 그 위에는 깨진 그릇 하나가 놓여 있었다. 벽에는 아이가 그린 그림이 남아 있었다.\n\n초록색 들판.\n\n파란 하늘.\n\n그리고 중앙에 커다란 빛.\n\n당신은 한참 동안 그림을 바라보았다.\n\n“여기에도 사람들이 살았겠죠.”\n\n카이렌이 말했다.\n\n“살았어.”\n\n“그럼 왜…”\n\n“균열 때문일 거야.”\n\n그 순간. 마을 어딘가에서 신음소리가 들렸다. 당신이 뒤를 돌아보았다. 한 사람이 천천히 걸어왔다. 하지만 사람이 아니었다.\n\n좀비.\n\n뒤이어 무너진 집에서 해골들이 일어났다. 그리고 벽을 타고 거미들이 내려왔다. 카이렌이 검을 뽑았다.\n\n“이제 알겠군.”\n\n그는 폐허를 바라보았다.\n\n“여기가 왜 아무도 없는지.”"}, {"id": "3-4", "ch": 3, "round": 4, "label": "3-4 클리어", "title": "마지막 실험", "text": "전투가 끝난 뒤 당신은 폐허 안쪽에서 무너진 건물을 발견했다. 안으로 들어가자 다른 집들과는 전혀 다른 흔적이 남아 있었다.\n\n책상.\n\n연구 장비.\n\n깨진 유리병.\n\n마력 측정 장치.\n\n그리고 벽을 가득 채운 기록.\n\n카이렌은 그중 하나를 집었다.\n\n‘균열은 마력을 만들어내지 않는다.’\n\n다음 기록.\n\n‘세계에 존재하는 마력을 끌어모으고 있다.’\n\n다음.\n\n‘균열이 성장할수록 주변의 생명체가 영향을 받기 시작한다.’\n\n그리고 마지막 기록.\n\n‘우리는 실험을 중단해야 한다.’\n\n당신은 연구실을 둘러보았다. 그런데 이상했다.\n\n실험을 중단했다면—\n\n왜 연구 장비는 그대로 남아 있는 걸까?\n\n카이렌도 같은 생각을 한 것 같았다. 그가 말했다.\n\n“누군가는 멈추지 않았어.”\n\n책상 위에는 마지막 실험 기록이 있었다.\n\n‘조금만 더 마력을 주입하면 균열의 중심에 도달할 수 있다.’\n\n카이렌이 기록장을 닫았다.\n\n“이게 마지막 실험이었겠군.”"}, {"id": "3-5", "ch": 3, "round": 5, "label": "3-5 클리어", "title": "불사조", "text": "연구실을 나온 순간. 하늘이 붉게 변했다.\n\n“뭐지?”\n\n재가 하늘로 솟구쳤다.\n\n그리고—\n\n쿠웅!\n\n거대한 불꽃이 폐허 중앙에서 폭발했다. 불꽃 속에서 거대한 새가 날아올랐다.\n\n불타는 날개.\n\n붉은 깃털.\n\n온몸을 휘감은 화염.\n\n불사조.\n\n날개가 한 번 움직일 때마다 불길이 사방으로 퍼졌다. 바닥에 불꽃이 남았다. 당신은 불길을 피해 움직였다. 하지만 불사조는 계속해서 넓은 범위를 불태웠다.\n\n카이렌이 외쳤다.\n\n“불길에 오래 머물지 마!”\n\n전투가 길어질수록 폐허는 불바다가 되었다. 마침내 마지막 공격이 불사조에게 적중했다. 불사조가 하늘에서 떨어졌다.\n\n하지만—\n\n바닥의 불길은 한동안 꺼지지 않았다. 카이렌이 불타는 폐허를 바라보았다.\n\n“이곳의 마력은 이미 한계를 넘었어.”"}, {"id": "3-7", "ch": 3, "round": 7, "label": "3-7 클리어", "title": "균열", "text": "불사조가 사라진 자리. 세 번째 유물이 모습을 드러냈다.\n\n당신이 그것을 집어 드는 순간—\n\n들판에서 얻었던 유물과 설산에서 얻었던 유물이 동시에 반응했다.\n\n세 개의 유물이 빛났다. 그리고 서로를 향해 떠올랐다.\n\n푸른빛.\n\n흰빛.\n\n붉은빛.\n\n세 마력이 연결되었다.\n\n그 순간 당신의 눈앞에 세 지역의 모습이 겹쳐졌다.\n\n들판.\n\n설산.\n\n폐허.\n\n서로 멀리 떨어져 있는 장소였다. 하지만 세 균열에서는 똑같은 문양이 나타났다.\n\n그리고—\n\n세 곳의 마력이 하나의 방향으로 흘러가고 있었다. 당신이 말했다.\n\n“이 세 균열…”\n\n카이렌이 고개를 끄덕였다.\n\n“하나로 연결되어 있어.”\n\n“그럼 이 마을도…”\n\n“그래.”\n\n그가 폐허를 바라보았다.\n\n“이곳에서 균열을 연구했던 사람들이 다른 균열까지 조사했겠지.”\n\n카이렌이 세 유물을 바라보았다.\n\n“그리고 결국 균열의 중심을 찾으려고 했을 거야.”"}, {"id": "3-9", "ch": 3, "round": 9, "label": "3-9 클리어", "title": "마지막 수문장", "text": "연구실 가장 깊은 곳. 낡은 문 하나가 있었다. 문에는 세 개의 문양이 새겨져 있었다. 당신이 유물을 가까이 가져가자 문이 열렸다. 안쪽에는 아무것도 없었다. 그저 어둠뿐이었다.\n\n그리고—\n\n목소리가 들렸다.\n\n“돌아가라.”\n\n당신이 뒤를 돌아보았다.\n\n아무도 없었다.\n\n“더 이상 나아가서는 안 된다.”\n\n어둠 속에서 희미한 형체가 나타났다. 사람의 모습. 하지만 몸은 연기처럼 흐릿했다.\n\n유령.\n\n카이렌이 검을 들었다.\n\n“기다려.”\n\n유령은 공격하지 않았다. 대신 조용히 말했다.\n\n“우리는 너무 늦게 깨달았다.”\n\n주변에 과거의 모습이 떠올랐다. 연구자들.\n\n실험 장치.\n\n폭주하는 균열.\n\n도망치는 사람들.\n\n불타는 마을.\n\n“균열은 우리의 적이 아니었다.”\n“하지만 우리는 그것을 힘으로 만들려 했다.”\n\n유령의 목소리가 떨렸다.\n\n“그리고 이곳을 잃었다.”\n\n당신이 물었다.\n\n“그럼 왜 우리를 막는 거죠?”\n\n“마지막 문을 열면…”\n\n유령이 당신을 바라보았다.\n\n“균열은 다시 깨어날 것이다.”\n\n그 순간 유령의 모습이 일그러졌다. 마력이 폭발했다. 카이렌이 외쳤다.\n\n“조심해!”\n\n당신이 공격했다.\n\n하지만 물리 공격은 유령의 몸을 그대로 통과했다.\n\n“공격이 안 먹혀!”\n\n카이렌이 말했다.\n\n“마력으로 공격해!”\n\n당신이 마법 공격을 가하자 유령의 몸이 흔들렸다.\n\n한 번.\n\n두 번.\n\n그리고—\n\n유령의 형체가 서서히 무너지기 시작했다."}, {"id": "3-10", "ch": 3, "round": 10, "label": "3-10 클리어", "title": "균열의 끝", "text": "유령이 사라졌다. 방 안에는 조용한 빛만 남았다.\n\n그리고 중앙에—\n\n거대한 마력핵이 모습을 드러냈다. 지금까지 보았던 핵과는 비교할 수 없었다. 거대한 빛이 방 전체를 가득 채웠다. 카이렌은 한동안 그것을 바라보았다.\n\n“이게…”\n\n그가 낮게 말했다.\n\n“모든 균열이 향하던 곳이야.”\n\n당신은 세 개의 유물을 꺼냈다.\n\n들판에서 얻은 유물.\n\n설산에서 얻은 유물.\n\n그리고 폐허에서 얻은 유물.\n\n세 유물이 동시에 빛나기 시작했다.\n\n마력핵이 크게 흔들렸다. 당신이 놀라 뒤로 물러섰다.\n\n“잘못된 거 아니에요?”\n\n“아니.”\n\n카이렌이 말했다.\n\n“계속해.”\n\n유물의 빛이 마력핵으로 흘러들어갔다.\n\n푸른빛.\n\n주황빛.\n\n노란빛.\n\n세 가지 마력이 서로 얽혔다. 그리고 거대한 균열이 흔들리기 시작했다. 무너지는 것처럼 보였다.\n\n하지만—\n\n조금씩 빛이 잦아들었다. 폭주하던 마력이 안정되기 시작했다. 카이렌이 깨달은 듯 말했다.\n\n“……그래.”\n“없애는 게 아니었어.”\n\n당신이 그를 바라보았다.\n\n“균열을 닫는 게 아니라…”\n\n카이렌이 마력핵을 바라보았다.\n\n“원래의 흐름으로 되돌리는 거야.”\n\n마지막 빛이 터져 나왔다.\n\n그리고—\n\n균열이 조용해졌다.\n\n— 에필로그—"}, {"id": "e", "ch": 4, "round": 0, "label": "3-10 클리어", "title": "에필로그 · 용의 횃불의 새로운 영웅", "text": "며칠 뒤. 용의 횃불은 오랜만에 활기를 되찾았다. 광장에는 사람들이 모였다. 가게마다 장식이 걸렸고, 아이들은 광장을 뛰어다녔다. 그리고 광장 중앙. 당신은 단상 위에 서 있었다. 영주로부터 하나의 훈장이 수여됐다.\n\n[용의 횃불의 명예 모험가]\n\n마을을 위협했던 균열을 탐험하고, 수많은 마물을 토벌했으며, 오랫동안 밝혀지지 않았던 균열의 비밀을 밝혀낸 공로. 사람들의 박수가 광장을 가득 채웠다. 당신은 사람들 사이에서 익숙한 얼굴 하나를 발견했다.\n\n카이렌.\n\n그는 다른 사람들보다 조금 떨어진 곳에서 조용히 웃고 있었다. 행사가 끝난 뒤 카이렌이 다가왔다.\n\n“축하한다.”\n\n당신은 표창장을 바라보았다.\n\n“정말 제가 받은 거 맞죠?”\n\n“가짜로 하나 더 만들어줄까?”\n\n당신이 웃었다. 카이렌도 웃었다. 잠시 후 그는 말했다.\n\n“그런데 말이야.”\n\n카이렌의 표정이 달라졌다. 그가 낡은 지도를 펼쳤다. 지도에는 붉은 표시가 하나둘 찍혀 있었다.\n\n“새로운 균열이 발견됐어.”\n\n당신이 지도를 바라보았다.\n\n“또요?”\n\n“이번에는 용의 횃불 주변이 아니야.”\n\n카이렌이 손가락으로 지도의 다른 지역을 가리켰다.\n\n“이곳.”\n\n그리고 또 다른 곳.\n\n“여기도.”\n\n마지막으로 지도 가장자리.\n\n“그리고 여기.”\n\n당신은 말없이 지도를 바라보았다. 카이렌이 웃었다.\n\n“아무래도 우리가 해결한 건 시작에 불과했던 모양이야.”\n\n당신은 창밖을 바라보았다. 석양이 지고 있었다. 처음 용의 술잔에 들어갔던 날과 같은 하늘이었다. 하지만 이제는 그 하늘을 바라보는 당신의 마음이 달라져 있었다. 그때의 당신은 그저 따분한 하루를 보내던 평범한 사람이었다. 모험가라고 부르기에도 부족했다. 하지만 지금은 달랐다.\n\n수많은 마물을 만났고,\n\n수많은 전투를 치렀으며,\n\n자신의 힘으로 균열을 탐험했다.\n\n그리고 마침내—\n\n한때 아무것도 아니었던 자신이, 누군가에게는 동경의 대상이 될 만큼 성장했다. 카이렌이 먼저 자리에서 일어났다.\n\n“갈까?”\n\n당신이 그를 바라보았다.\n\n“어디로요?”\n\n카이렌이 지도를 접었다.\n\n“다음 균열.”\n\n그가 문을 열었다. 밖으로 석양빛이 들어왔다. 당신은 잠시 용의 술잔을 바라보았다. 처음 이곳에서 보았던 게시판.\n\n처음 발견했던 모집 공고.\n\n그리고 처음 시작했던 모험.\n\n모든 것이 오래전 일처럼 느껴졌다. 당신은 자리에서 일어났다. 그리고 카이렌을 따라 문밖으로 나섰다.\n\n새로운 마을.\n\n새로운 사람들.\n\n새로운 균열.\n\n새로운 마물.\n\n그리고 아직 밝혀지지 않은 수많은 이야기.\n\n모험가에게 끝이란—\n\n마지막 장소가 아니라, 다음 목적지를 뜻하는 말이었다. 두 사람의 모습이 석양 속으로 멀어졌다. 그리고 용의 횃불의 가장 높은 곳. 마을을 지켜보던 횃불이 바람에 흔들렸다. 마치 앞으로 나아갈 길을 밝혀주듯.\n\n《Another Hero》 한 사람의 모험은 하나의 세계를 바꿀 수 있다. 그리고 당신의 다음 모험은 이제 막 시작되었다."}];

const ptsTotal=a=>(a.lv-1)*PTS_PER_LV;
const ptsSpent=a=>Object.values(a.slv).reduce((s,n)=>s+n,0);
const ptsLeft =a=>ptsTotal(a)-ptsSpent(a);
/* 스탯 실제 값 = 모델 초기값 + 스탯 레벨 × 레벨당 상승량 */
const statVal=(a,k,extra=0)=>BASE_STAT[a.model][k]+((a.slv[k]||0)+extra)*STAT_GAIN[k];
const fmtStat=(k,v)=>(k==='crit'||k==='cdr')?v+'%':k==='aspd'?v.toFixed(1):k==='def'?`${v} <small class="mutet">(피해 -${(v/2).toFixed(1)}%)</small>`:fmt(Math.round(v));

function seedInventory(){
  const add=(cat,name,count)=>S.inv.push({cat,name,count});
  [['발테아스',2],['쉐리안',1],['레티온',1],['루미엘',1],['네메시스',1]].forEach(([n,c])=>add('model',n,c));
  [['불',2],['물',1],['빛',1],['풀',3]].forEach(([n,c])=>add('attr',n,c));
  [['#활발함',3],['#명랑함',1],['#도도함',2]].forEach(([n,c])=>add('pers',n,c));
  // 이펙트(예시 보유): [모험가, 스킬, 외형, 수량]
  [['발테아스',0,0,1],['발테아스',0,1,1],['발테아스',1,0,2],['발테아스',2,2,1],['레티온',0,0,1],['레티온',1,1,1],['레티온',2,0,1],
   ['루미엘',0,0,1],['루미엘',1,0,1],['루미엘',2,1,1],['쉐리안',0,2,1]].forEach(([m,s,v,c])=>add('fx',fxName(m,s,v),c));
}

/* 우편 남은 기한: age = 도착 후 지난 일수(예시) → D-(30-age) */
const mailLeft=m=>m.type==='story'?null:MAIL_KEEP_DAYS-(m.age||0);   // 스토리 우편은 기한 없음
const mailDue=m=>mailLeft(m)===null?'기한 없음':'D-'+mailLeft(m);
function seedMail(){
  // 이전 접속 때 받은 알림 1건(이미 확인함) — 예시
  S.mails.push({id:'m-off-old',type:'notice',title:'오프라인 보상 자동 수령 완료',from:'오프라인 보상',time:'어제',age:1,
    note:'2-5 EASY 기준 · 누적 05시간 12분',items:{gold:84,stone:300,shard:11},done:true});
  const arrived=STORY.filter(isUnlocked);
  arrived.forEach((e,i)=>{
    S.mails.push({id:'m-'+e.id,type:'story',story:e.id,title:e.title,from:'카이렌 모험가 길드',
      time:e.label, age:Math.min(27,(arrived.length-1-i)*2), done:S.read.has(e.id)});   // age는 예시 일수
  });
  S.mails.sort((a,b)=>(a.done-b.done));   // 안 읽은/미수령 우편을 위로
}
/* 스토리 해금 판정: 사용자 확정 규칙
   프롤로그=기본, 구간 마지막 라운드 클리어 시 도착, 에필로그=3-10 클리어 */
function isUnlocked(e){
  if(e.id==='p') return true;
  const ch = e.id==='e'?3:e.ch, r = e.id==='e'?10:e.round;
  return ch<S.prog.ch || (ch===S.prog.ch && r<=S.prog.round);
}

/* ---- 균열: 스테이지/라운드 (기존 시안 재현) ---- */

  // 지그재그 노드 좌표 (1~5 윗줄 왼→오, 6~10 아랫줄 오→왼) — 기존 시안 배치
  const pos=r=>r<=5?{x:225+(r-1)*383,y:340}:{x:1757-(r-6)*383,y:710};
  const nodes=[...Array(10)].map((_,i)=>{
    const r=i+1, p=pos(r), boss=r===5||r===10, open=r<=reach;
    return `<button class="rnode ${boss?'boss':''} ${open?'open':'lock'} ${cur===r?'now':''}" style="left:${p.x}px;top:${p.y}px" data-round="${r}" aria-label="${st.no}-${r}${open?'':' 잠김'}">
      ${boss?`<img src="${A[r===5?'boss5':'boss10']}" alt="">`:(open?'<span class="ck">✓</span>':'<span class="lk"></span>')}

  }).join('');
  const tabs=STAGES.map(s=>{const r=prog[s.no]||0;const lock=r===0;

    return `<button class="stab ${v.stage===s.no?'on':''}" data-stab="${s.no}" style="--tone:${s.tone};--soft:${s.soft}" ${lock?'aria-disabled="true"':''}>
      <span class="sic">${state}</span><span><small style="white-space:nowrap">${v.diff==='HARD'?'HARD · ':''}스테이지 0${s.no}</small><b>${s.name}</b><small>${lock?unlockText(v.diff,s.no):`${r} / 10`}</small></span></button>`}).join('');
  return `${battleBg(v.stage,v.diff)}<div class="bg-veil" style="background:rgba(255,255,255,.12)"></div>

    <div class="stagehint">라운드를 누르면 로비 배틀 화면이 해당 테마·난이도로 바뀝니다</div>`;
}

/* ---- 강화: 스킬 강화(금화+강화석) + 스탯 분배(포인트+금화) — 4조 현황보고 수치 반영 ---- */
/* 스킬 강화 비용 — 미정이라 임의 설정: Lv.L→L+1 = 금화 500+250L, 강화석 10+5L (Lv.19→20: 금화 5,250 · 강화석 105) */
function skillCost(lv){return {gold:500+lv*250, stone:10+lv*5}}
const cdAt=(base,lv)=>+(base*(1-lv*SKILL_CD_PER_LV/100)).toFixed(2); // 레벨당 쿨타임 2% 감소
function renderEnhance(){
  const a=S.adv.find(x=>x.id===S.sel.enhId)||S.adv[0];
  if(!S.enh||S.enh.id!==a.id) S.enh={id:a.id,add:{hp:0,atk:0,def:0,crit:0,aspd:0},skill:0,confirm:false};
  const e=S.enh, used=Object.values(e.add).reduce((s,n)=>s+n,0), left=ptsLeft(a)-used;
  // 미리보기 금화: 스탯별로 (현재 레벨+1)부터 (현재+추가) 레벨까지 statGold 합
  const gold=Object.entries(e.add).reduce((s,[k,n])=>{let g=0;for(let i=1;i<=n;i++) g+=statGold((a.slv[k]||0)+i);return s+g},0);
  const spent=ptsSpent(a);            // 이미 적용된 포인트 합
  const sk=e.skill, lv=a.skill[sk], info=SKILLS[a.model][sk], max=lv>=SKILL_MAX;
  const c=skillCost(lv), can=!max&&S.cur.gold>=c.gold&&S.cur.stone>=c.stone;
  return `<div class="win">${winHead('enhance','강화','스킬 강화 · 스탯 분배')}
    <div class="enh">
      <div class="panel eskill">
        <div class="advpick">${S.adv.map(x=>`<button class="opt" data-enh="${x.id}" aria-pressed="${x.id===a.id}">${x.name}</button>`).join('')}</div>
        <b style="font-size:24px">스킬 강화 <small class="mutet">· 레벨당 쿨타임 -2%, 최대 Lv.${SKILL_MAX}</small></b>
        <div class="sklist">${a.skill.map((l,i)=>`<button class="skcard" data-sk="${i}" aria-pressed="${i===sk}"><span class="skico">S${i+1}</span><span><b>${SKILLS[a.model][i].n}</b><small>Lv.${l} / ${SKILL_MAX}</small></span></button>`).join('')}</div>
        <div class="skdetail">
          <div><b style="font-size:24px">${info.n}</b><p class="mutet" style="margin:4px 0 0">${info.d} · 기본 쿨타임 ${info.cd}초</p></div>
          <div class="cmp"><div><small>현재</small><b>Lv.${lv}</b><span>쿨타임 ${cdAt(info.cd,lv)}초</span></div><span class="arrow">→</span>
            <div class="next"><small>강화 후</small><b>${max?'MAX':'Lv.'+(lv+1)}</b><span>${max?'최대 레벨':'쿨타임 '+cdAt(info.cd,lv+1)+'초'}</span></div></div>
          <div class="cost"><span><img src="${A.gold}" alt="">${fmt(c.gold)}</span><span><img src="${A.gem}" alt="">${fmt(c.stone)}</span><small class="mutet">비용 임의 설정</small></div>
          <button class="btn" data-act="${can?'skillUp':'lackSkill'}" ${max?'disabled':''}>${max?'최대 레벨':can?'스킬 강화':'재화 부족 · 확인'}</button>
        </div>
      </div>
      <div class="cbig" style="position:relative"><img src="${figOf(a)}" alt="${a.name}" style="height:800px">
        <span class="tag" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 22px;font-size:24px;font-weight:900;white-space:nowrap">${attrDot(a.attr,30)} ${a.name} · ${a.model} · Lv.${a.lv}</span></div>
      <div class="panel estat">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:24px">스탯 분배</b><span class="chip ${left?'pink':''}">남은 포인트 ${left}</span></div>
        ${STATS.map(s=>{const sl=a.slv[s.k]||0, add=e.add[s.k], full=sl+add>=STAT_MAX[s.k], nextG=statGold(sl+add+1);
          return `<div class="srow"><span class="sn">${s.n}<small class="slv">Lv.${sl+add}/${STAT_MAX[s.k]}</small></span>
          <span class="sv">${fmtStat(s.k,statVal(a,s.k))}${add?` <em>→ ${s.k==='def'?statVal(a,s.k,add):fmtStat(s.k,statVal(a,s.k,add))}</em>`:''}</span>
          <span class="spt">${add?'+'+add:''}</span>
          <span class="arrows"><button class="ar" data-st="${s.k}" data-d="1" ${left>0&&!full&&S.cur.gold>=gold+nextG?'':'disabled'} title="${full?'최대 레벨':'다음 레벨 금화 '+fmt(nextG)}" aria-label="${s.n} 올리기">▲</button><button class="ar" data-st="${s.k}" data-d="-1" ${add?'':'disabled'} aria-label="${s.n} 내리기">▼</button></span></div>`}).join('')}
        <div class="cost" style="justify-content:space-between"><span class="mutet">Lv.${a.lv} · 총 포인트 ${ptsTotal(a)} (레벨업당 ${PTS_PER_LV}) · 금화 = 100 × 올라갈 레벨 (임의)</span><span><img src="${A.gold}" alt="">${fmt(gold)}</span></div>
        <div style="display:flex;gap:12px;justify-content:space-between;align-items:center">
          <button class="btn ghost" data-act="statResetAll" ${spent?'':'disabled'} title="적용된 포인트를 모두 돌려받음">스탯 초기화</button>
          <span style="display:flex;gap:12px"><button class="btn ghost" data-act="statReset" ${used?'':'disabled'}>되돌리기</button><button class="btn lav" data-act="statApply" ${used?'':'disabled'}>적용</button></span></div>
      </div>
    </div>
    ${e.confirm?popShell({title:'스탯 초기화',sub:'적용한 포인트를 모두 돌려받아요',icon:'!',
      body:`<b style="font-size:32px">${a.name}의 스탯을 초기화할까요?</b>
        <p style="font-size:22px;margin:0">적용된 스탯 포인트 <b>${spent}</b>개를 돌려받고 모든 스탯이 Lv.0으로 돌아갑니다.</p>
        <p style="margin:0;font-size:20px;color:#e3557a;font-weight:700">스탯에 사용한 금화는 돌려받지 않습니다</p>`,
      note:'되돌릴 수 없어요 · 버튼을 1초 누르면 실행',
      btns:`<button class="btn ghost" data-act="statResetCancel">취소</button>${holdBtn('statResetOk','초기화')}`}):''}
  </div>`;
}

/* ---- 인벤토리 (시안 A: 8열 전체폭 / 시안 B: 6열 + 상세 패널) ---- */
function invItems(){
  const cur=['gold','stone','shard'].map(k=>({cat:'currency',key:k,name:curName[k],count:S.cur[k]}));
  return [...cur,...S.inv];
}
function renderInven(){
  const v=S.variant.inven, tab=S.sel.invTab||'all';
  const all=invItems();
  const fxm=S.sel.invFxModel||'all';   // 이펙트 탭 모험가 필터
  const items=(tab==='all'?all:all.filter(i=>i.cat===tab)).filter(i=>tab!=='fx'||fxm==='all'||FX_META[i.name].model===fxm);
  const cols=v==='A'?8:6, rows=4, vis=cols*rows;          // 한 화면에 보이는 칸 수
  const pad=Math.max(0,(tab==='all'?INV_CAP:vis)-items.length);   // 전체 탭은 48칸 전부 그림, 나머지 탭은 한 화면만 채움
  const selIdx=Math.min(S.sel.invIdx??0,items.length-1);
  const it=items[selIdx];
  const cnt=c=>c==='all'?all.length:all.filter(i=>i.cat===c).length;
  const desc={gold:'스킬 강화 비용으로 사용합니다. 강화 시 강화석과 함께 소모됩니다.',
              stone:'강화에 사용하는 재화입니다. 강화 시 금화와 함께 소모됩니다.',
              shard:'모험가 모집(가챠)에 사용하는 재화입니다.'};
  const detailText = it ? (it.cat==='currency'?desc[it.key]
      : it.cat==='model' ? `${MODELS.find(m=>m.name===it.name).job} · ${MODELS.find(m=>m.name===it.name).role}`
      : it.cat==='attr' ? '모험가 생성 시 적용할 수 있는 속성입니다.'
      : it.cat==='fx' ? `${FX_META[it.name].model}의 스킬 ${FX_META[it.name].s+1} '${SKILLS[FX_META[it.name].model][FX_META[it.name].s].n}' 외형 ${FX_VARS[FX_META[it.name].v]}. 모험가 생성 시 해당 스킬에 적용 (아트 제작 전)`
      : '모험가 생성 시 적용할 수 있는 요소입니다.') : '';
  const slotHTML = items.map((x,i)=>`
    <button class="slot ${x.cat==='currency'?'c-currency':''}" data-inv="${i}" aria-pressed="${v==='B'&&i===selIdx}">
      <span class="cat">${catName[x.cat]}</span>
      <span class="art">${itemArt(x)}</span>
      <span class="nm">${x.name}</span>
      <span class="cnt">${x.cat==='currency'?fmt(x.count):'×'+x.count}</span>
    </button>`).join('') + '<div class="slot empty"></div>'.repeat(pad);
  return `<div class="win">${winHead('inven','인벤토리','재화 · 보유 요소')}
    <div class="inv ${v}">
      <div class="panel gridbox">
        <div class="tabs" role="tablist">
          ${['all','currency','model','attr','pers','fx'].map(c=>`<button class="tab" role="tab" data-invtab="${c}" aria-selected="${tab===c}">${c==='all'?'전체':catName[c]}<span class="n">${cnt(c)}</span></button>`).join('')}
        </div>
        ${tab==='fx'?`<div class="tabs">${['all',...MODELS.map(m=>m.name)].map(n=>`<button class="opt" data-invfx="${n}" aria-pressed="${fxm===n}">${n==='all'?'전체':n}</button>`).join('')}</div>`:''}
        <div class="grid">${slotHTML}</div>
        ${v==='A'?`<div class="hoverbar">${it?`<span class="art" style="width:56px;height:56px;transform:scale(.66);transform-origin:left">${itemArt(it)}</span><b>${it.name}</b><span>${detailText}</span>`:''}</div>`:''}
        <div class="footer"><span>사용 ${all.length} / ${INV_CAP}칸 · 한 화면 ${cols}열×${rows}행 = ${vis}칸 (세로 스크롤)</span><span>중복 획득은 같은 칸에 수량으로 쌓임</span></div>
      </div>
      ${v==='B'&&it?`<div class="panel detail">
        <div class="big"><span class="art">${itemArt(it)}</span></div>
        <div><span class="chip">${catName[it.cat]}</span></div>
        <h3>${it.name}</h3>
        <p>${detailText}</p>
        <dl class="kv"><dt>보유</dt><dd>${it.cat==='currency'?fmt(it.count):it.count+'개'}</dd>
        ${it.cat==='currency'?`<dt>획득</dt><dd>스테이지·라운드 클리어, 오프라인 보상</dd>`:`<dt>획득</dt><dd>모험가 모집</dd>`}</dl>
        <span class="spacer" style="flex:1"></span>
        ${it.cat==='currency'
          ? (it.key==='shard'?`<button class="btn lav" data-go="recruit">모험가 모집으로</button>`:`<button class="btn" disabled>강화 (이번 범위 외)</button>`)
          : `<button class="btn lav" data-go="create">모험가 생성에 사용</button>`}
      </div>`:''}
    </div></div>`;
}

/* ---- 우편함 (시안 A: 목록+상세 / 시안 B: 카드형) ---- */
function mailIcon(m){return m.type==='story'?`<span class="mi story"><span class="seal">길</span>${m.done?'':'<span class="dot"></span>'}</span>`:`<span class="mi reward"><span class="gift"></span>${m.done?'':'<span class="dot"></span>'}</span>`}
/* 상태 칩: 스토리=새 이야기/읽음, 알림=새 알림/확인함 (보상은 이미 자동 수령되어 '받기' 없음) */
function mailState(m){return m.type==='story'?(m.done?'<span class="chip">읽음</span>':'<span class="chip gold">새 이야기</span>'):(m.done?'<span class="chip">확인함</span>':'<span class="chip pink">새 알림</span>')}
function renderMail(){
  const v=S.variant.mail, tab=S.sel.mailTab||'all';
  const list=S.mails.filter(m=>tab==='all'||m.type===tab);
  const sel=list.find(m=>m.id===S.sel.mailId)||list[0];
  const unreadNotice=S.mails.some(m=>!m.done);   // 알림·스토리 중 하나라도 미확인
  const n=t=>S.mails.filter(m=>(t==='all'||m.type===t)&&!m.done).length;
  const tabs=`<div class="tabs" role="tablist">${[['all','전체'],['notice','알림'],['story','스토리']].map(([k,l])=>`<button class="tab" role="tab" data-mailtab="${k}" aria-selected="${tab===k}">${l}<span class="n">${n(k)}</span></button>`).join('')}</div>`;
  const bottom=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-size:19px;color:var(--ink-soft)">알림 최대 ${MAIL_KEEP_DAYS}일 · 스토리 기한 없음 · 확인하면 도감에 기록</span><button class="btn" data-act="checkAll" ${unreadNotice?'':'disabled'}>모두 확인</button></div>`;
  if(v==='A'){
    return `<div class="win">${winHead('mail','우편함','알림 · 스토리')}
      <div class="mail A">
        <div class="panel mlist">${tabs}
          <div class="rows">${list.map(m=>`<button class="mrow ${m.done?'done':''}" data-mail="${m.id}" aria-pressed="${sel&&m.id===sel.id}">${mailIcon(m)}<span><b>${m.title}</b><small>${m.from} · ${m.time} · <span class="dleft ${mailLeft(m)!==null&&mailLeft(m)<=3?'warn':''}">${mailDue(m)}</span></small></span>${mailState(m)}</button>`).join('')}</div>
          ${bottom}
        </div>
        <div class="panel mview">${sel?mailDetail(sel):''}</div>
      </div></div>`;
  }
  return `<div class="win">${winHead('mail','우편함','알림 · 스토리')}
    <div class="panel mlist" style="flex:1">${tabs}
      <div class="mcards">${list.map(m=>`<button class="mcard ${m.type==='story'?'story':''} ${m.done?'done':''}" data-mail="${m.id}" data-open="1">
        ${m.type==='story'?`<div class="env"><span class="seal" style="width:64px;height:64px;font-size:26px">길</span></div>`:`<div class="rewards" style="gap:10px">${Object.entries(m.items).map(([k,c])=>`<span class="chip pink"><img src="${curIcon[k]}" alt="" style="width:28px;height:28px">${c}</span>`).join('')}</div>`}
        <b style="font-size:24px">${m.title}</b><small style="font-size:18px;color:var(--ink-soft)">${m.from} · ${m.time} · ${mailDue(m)}</small>${mailState(m)}</button>`).join('')}</div>
      ${bottom}
    </div>
    ${S.sel.mailOpen&&sel?`<div class="overlay" data-act="closeOverlay"><div class="panel mview" style="width:1100px;height:820px" data-stop="1">${mailDetail(sel)}</div></div>`:''}
  </div>`;
}
function mailDetail(m){
  if(m.type==='notice') return `
    <div style="display:flex;align-items:center;gap:14px"><span class="chip pink">알림 · 오프라인 보상</span><span style="font-size:20px;color:var(--ink-soft)">${m.note}</span></div>
    <h3 style="font-family:var(--f-title);font-weight:400;font-size:40px;margin:0">${m.title}</h3>
    <p style="font-size:21px;color:var(--ink-soft);margin:0">아래 보상은 접속 시 자동으로 수령되어 인벤토리에 들어갔습니다.</p>
    <div class="rewards">${Object.entries(m.items).map(([k,c])=>`<div class="reward"><img src="${curIcon[k]}" alt=""><b>${curName[k]}</b><span>+${c}</span></div>`).join('')}</div>
    <span style="flex:1"></span>
    <div style="display:flex;justify-content:flex-end;gap:12px">${S.variant.mail==='B'?'<button class="btn ghost" data-act="closeOverlay">닫기</button>':''}<button class="btn" data-act="checkNotice" data-id="${m.id}" ${m.done?'disabled':''}>${m.done?'확인함':'확인'}</button></div>`;
  const e=STORY.find(s=>s.id===m.story);
  const body=e.text.replace(/</g,'&lt;').replace(/\n\n/g,'\n').split('\n').join('<br>');   // 편지지는 줄 간격이 넓어 문단 사이 빈 줄 없이 한 줄씩   // 전문을 편지지 안에서 스크롤
  return `
    <div style="display:flex;align-items:center;gap:14px"><span class="chip gold">스토리 · ${e.label}</span><span class="mutet">스크롤해서 끝까지 읽을 수 있어요</span></div>
    <div class="letter" style="line-height:48px"><div class="from">${m.from}에서 온 기록</div><b style="font-size:28px">${e.title}</b><br>${body}</div>
    <div style="display:flex;justify-content:flex-end;gap:12px">${S.variant.mail==='B'?'<button class="btn ghost" data-act="closeOverlay">닫기</button>':''}
      ${m.done?`<button class="btn ghost" data-act="readStory" data-id="${e.id}">도감에서 보기</button><button class="btn lav" disabled>수령 완료</button>`
              :`<button class="btn lav" data-act="takeStory" data-id="${e.id}">확인 · 도감에 기록</button>`}</div>`;
}

/* ---- 모험가 모집 (요소별 개별 뽑기, 등급 없음, 중복은 인벤토리 저장) ---- */
const POOL={model:MODELS.map(m=>m.name),attr:ATTRS,pers:PERS,fx:FXS};
const gName={model:'모델',attr:'속성',pers:'성격 키워드',fx:'이펙트'};   // POOL.fx는 FXS(90종) 참조
function renderRecruit(){
  const t=S.gTab, owned=n=>S.inv.find(i=>i.cat===t&&i.name===n);
  const gfm=S.sel.gFxModel||'발테아스';   // 이펙트 탭: 모험가별로 9종씩 표시
  const pool=t==='fx'?POOL.fx.filter(n=>FX_META[n].model===gfm):POOL[t];
  const per=(100/POOL[t].length).toFixed(1);
  const r=S.sel.gResult;
  return `<div class="win">${winHead('recruit','모험가 모집','요소별 개별 뽑기')}
    <div class="gacha">
      <div class="gside">
        ${Object.keys(POOL).map(k=>true?`<button class="gtab" data-gtab="${k}" aria-selected="${t===k}"><span>${gName[k]}<small>${S.inv.filter(i=>i.cat===k).length} / ${POOL[k].length} 보유</small></span></button>`
          :`<button class="gtab" disabled style="opacity:.55;cursor:not-allowed"><span>${gName[k]}<small>제작 예정 · 총 ${FX_TOTAL}종 (모험가 10 × 스킬 3 × 3종)</small></span></button>`).join('')}
        <span style="flex:1"></span>
        <div class="panel" style="padding:16px 20px;display:flex;align-items:center;gap:12px;font-size:21px"><img src="${A.shard}" alt="" style="width:52px">뽑기 재화 · 마력파편<b style="margin-left:auto;font-variant-numeric:tabular-nums">${fmt(S.cur.shard)}</b></div>
      </div>
      <div class="gstage">
        <div style="padding:26px 34px 0;display:flex;align-items:center;gap:14px"><b style="font-family:var(--f-title);font-size:34px;font-weight:400">${gName[t]} 모집 풀</b><span class="chip">등급 없음 · 동일 확률 개당 ${per}%${t==='fx'?' (90종 · 아트 제작 전)':''}</span></div>
        ${t==='fx'?`<div class="tabs" style="padding:14px 34px 0">${MODELS.map(m=>`<button class="opt" data-gfx="${m.name}" aria-pressed="${gfm===m.name}">${m.name}</button>`).join('')}</div>`:''}
        <div class="pool" ${t==='fx'?'style="grid-template-columns:repeat(3,1fr);padding-top:16px"':''}>${pool.map(n=>{const it={cat:t,name:n};const o=owned(n);return `<div class="slot ${o?'':'unowned'}"><span class="art">${itemArt(it)}</span><span class="nm">${n}</span>${o?`<span class="cnt">×${o.count}</span>`:'<span class="cat">미획득</span>'}</div>`}).join('')}</div>
        <div class="gfoot"><span style="font-size:20px;color:var(--ink-soft)">확률·천장은 기획 미확정 · 비용은 표시만</span>
          <div style="display:flex;gap:16px">
            <button class="btn lav pullbtn" data-act="pull" data-n="1">1회 모집<small>마력파편 × 비용 미정</small></button>
            <button class="btn pullbtn" data-act="pull" data-n="10">10회 모집<small>마력파편 × 비용 미정</small></button>
          </div></div>
      </div>
    </div>
    ${r?`<div class="overlay"><div class="result">
      <div style="text-align:center"><span class="ribbon">✦ ${gName[r.tab]} 모집 ${r.list.length}회 결과 ✦</span></div>

function newCreate(){
  const first=c=>(S.inv.find(i=>i.cat===c)||{}).name;

}

/* =====================================================================

function popShell({title,sub,icon,body,note,btns,wide}){
  return `<div class="overlay"><div class="offpop ${wide?'':'sm'}" role="dialog" aria-label="${title}">
    <div class="offhead"><span class="pill">${icon||'!'} ${title}</span><span>${sub||''}</span></div>
    <div class="offcard center">${body}</div>
    <div class="offfoot"><span>${note||''}</span><span style="display:flex;gap:12px">${btns}</span></div>
  </div></div>`;
}
/* 1초 길게 누르기 버튼 (되돌릴 수 없는 동작용). 손을 떼면 취소 */
function holdBtn(act,label){ return `<button class="btn hold" data-hold="${act}"><span class="holdbar"></span>${label} <small style="font-weight:700;opacity:.85">(1초)</small></button>`; }
/* 화면 위에 띄우는 공용 팝업: 생성 완료 / 재화 부족 */

  const p=S.popup; if(!p) return '';
  if(p.kind==='created'){ const a=S.adv.find(x=>x.id===p.id); if(!a) return '';
    return popShell({title:'모험가 생성 완료',sub:'새로운 모험가가 합류했어요',icon:'✓',wide:true,
      body:`<div style="display:flex;gap:30px;align-items:center;text-align:left;width:100%">
        <div style="width:220px;height:280px;border-radius:24px;background:var(--lav-soft);overflow:hidden;flex-shrink:0"><img src="${figOf(a)}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:top"></div>
        <div style="display:flex;flex-direction:column;gap:14px"><small class="mutet">이름</small><b style="font-size:40px">${a.name}</b>
          <div style="display:flex;gap:10px;align-items:center">${attrDot(a.attr,44)}<span class="chip pink">${a.pers}</span><span class="chip">${a.model}</span></div>
          <small class="mutet">장착 이펙트</small><div style="display:flex;gap:10px">${a.fx.map(n=>`<span class="chip gold">${n}</span>`).join('')}</div></div></div>`,
      note:'모험가 도감에서 언제든 다시 볼 수 있어요',
      btns:`<button class="btn ghost" data-act="createdParty">파티 편성</button><button class="btn" data-act="createdOk">✓ 확인</button>`}); }
  if(p.kind==='lack'){
    const row=(k)=>{const need=p.need[k]; if(!need) return ''; const have=S.cur[k], short=have<need;
      return `<div class="need ${short?'short':''}"><img src="${curIcon[k]}" alt=""><b>${curName[k]}</b><span style="text-align:right">필요 ${fmt(need)}<br><span class="have">보유 ${fmt(have)}</span></span></div>`};
    return popShell({title:'재화 부족',sub:p.sub||'재화가 조금 모자라요',icon:'!',
      body:`<div style="display:flex;flex-direction:column;gap:12px;width:100%">${['gold','stone','shard'].map(row).join('')}</div>`,
      note:'금화·강화석: 균열 라운드 클리어 · 오프라인 보상',
      btns:`<button class="btn ghost" data-act="popClose">닫기</button><button class="btn" data-act="popGo" data-to="stage">균열로</button>`}); }
  return '';
}
